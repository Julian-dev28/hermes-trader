apiVersion: v1
kind: ConfigMap
metadata:
  name: pathia-config
  namespace: pathia
# Non-secret runtime config (mirrors fly.toml [env]). Secrets — API keys, the
# wallet key, the operator token — live in the `pathia-secrets` Secret, NOT
# here. The /data path env vars (PATHIA_STATE_DIR, PATHIA_POSITIONS_SNAPSHOT_FILE,
# SESSION_LOG_PATH, PATHIA_DSL_STATE_FILE, PATHIA_AGENT_CONFIG_FILE,
# PATHIA_AGENT_MEMORY_FILE), PATHIA_BIND, and AI_BRAIN_PROVIDER are baked into
# the image (see Dockerfile) so every container already agrees on where
# shared state lives and how the server binds — they do not need to be
# repeated here. Per-process overrides (the `web` container's throttled HL
# rate-limit budget + PATHIA_STATE_READONLY) live on that one container's
# `env:` in statefulset.yaml, since a ConfigMap is shared by every container
# in the pod and can't vary per-container.
data:
  PATHIA_PORT: "8000"
  PATHIA_SCAN_INTERVAL: "60"
