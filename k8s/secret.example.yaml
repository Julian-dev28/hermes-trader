# Reference only — DO NOT commit a filled-in copy.
#
# Preferred: create the Secret straight from your gitignored .env.local so keys
# never touch a tracked file:
#
#   kubectl create secret generic pathia-secrets -n pathia \
#     --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
#     --from-literal=HYPERLIQUID_WALLET_ADDRESS="$HYPERLIQUID_WALLET_ADDRESS" \
#     --from-literal=HYPERLIQUID_PRIVATE_KEY="$HYPERLIQUID_PRIVATE_KEY" \
#     --from-literal=PATHIA_OPERATOR_TOKEN="$(openssl rand -hex 16)"
#
# For a pure screenshot demo you can use dummy values — the bot boots in OFF
# mode and serves the dashboard without placing trades.
#
# The four keys above are REQUIRED — every container reads this Secret via
# envFrom, and a missing OPENROUTER_API_KEY / HYPERLIQUID_* / PATHIA_OPERATOR_TOKEN
# degrades a real feature (research, order placement, the operator console)
# rather than failing to boot. Everything below is OPTIONAL: add a
# --from-literal for each one you actually use; a feature whose key is unset
# degrades to disabled/501, never a crash. See DEPLOY.md "Secrets" for what
# each one unlocks.
apiVersion: v1
kind: Secret
metadata:
  name: pathia-secrets
  namespace: pathia
type: Opaque
stringData:
  # ── Required ──────────────────────────────────────────────────────────────
  OPENROUTER_API_KEY: "sk-or-REPLACE_ME"
  HYPERLIQUID_WALLET_ADDRESS: "0xREPLACE_ME"
  HYPERLIQUID_PRIVATE_KEY: "0xREPLACE_ME"
  PATHIA_OPERATOR_TOKEN: "REPLACE_ME"
  # ── Optional ──────────────────────────────────────────────────────────────
  # BRAVE_API_KEY: "BSA-REPLACE_ME"                       # news search in research
  # UW_API_KEY: "REPLACE_ME"                              # Unusual Whales options-flow data
  # HYDROMANCER_API_KEY: "REPLACE_ME"                     # Hydromancer market data provider
  # HYPERLIQUID_MASTER_ADDRESS: "0xREPLACE_ME"            # agent-wallet setup
  # HYPERLIQUID_MASTER_PRIVATE_KEY: "0xREPLACE_ME"        # scripts/treasury.py transfers only
