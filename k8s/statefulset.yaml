apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-trader
  namespace: hermes
  labels:
    app: hermes-trader
spec:
  serviceName: hermes-trader
  # replicas is 1 ON PURPOSE — the `loop` writes .dsl-state.json / .agent-memory
  # / the positions snapshot to the shared volume and is a singleton by design.
  # Running two loops would double-trade and corrupt the ratchet state. This is
  # why it's a StatefulSet (stable identity + its own PVC), not a Deployment.
  replicas: 1
  selector:
    matchLabels:
      app: hermes-trader
  template:
    metadata:
      labels:
        app: hermes-trader
      annotations:
        # Fallback for annotation-based Prometheus scrape configs. The
        # operator-native path is k8s/servicemonitor.yaml.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # fsGroup so the mounted PVC is group-writable for state files. No
      # container here sets runAsUser (they all run as the image's default,
      # root), so this is currently a no-op — kept for forward compat if a
      # future hardening pass adds a non-root user to the Dockerfile.
      securityContext:
        fsGroup: 1000
      containers:
        # ── web: FastAPI dashboard + JSON API + /metrics ──────────────────────
        - name: web
          image: hermes-trader:local
          imagePullPolicy: IfNotPresent
          # No `command:` — falls through to the image's ENTRYPOINT
          # (docker-entrypoint.sh), which bootstraps /data/.state then execs
          # `args`. See Dockerfile "Runtime state" for why that step exists.
          args: ["python3", "-m", "hermes_trader.server"]
          env:
            # Dashboard shares the account with `loop`; HL rate-limits per
            # source IP-ish identity, not per process, so give the server a
            # HARD-throttled token bucket (~1/4 budget) and readonly state
            # mode — mirrors scripts/restart.sh's start_server(). `loop`
            # keeps the full code-default budget (300 cap / 15 refill); it's
            # the money path.
            - name: HERMES_STATE_READONLY
              value: "1"
            - name: HERMES_HL_RATE_REFILL_PER_SEC
              value: "2"
            - name: HERMES_HL_RATE_CAPACITY
              value: "60"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        # ── loop: autonomous scan → research → execute → DSL monitor ──────────
        - name: loop
          image: hermes-trader:local
          imagePullPolicy: IfNotPresent
          args: ["python3", "scripts/trading_loop.py"]
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          # No HTTP to probe — this is a worker. A startupProbe waits for the
          # first positions snapshot (proves it booted AND reached Hyperliquid);
          # after that, a process crash is the failure signal (restartPolicy
          # Always restarts it). No liveness flapping on transient API blips.
          # HERMES_POSITIONS_SNAPSHOT_FILE is baked to /data/.positions-snapshot.json
          # in the Dockerfile — this probe path must stay in sync with that.
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,sys,time; f='/data/.positions-snapshot.json'; sys.exit(0 if os.path.exists(f) and (time.time()-os.path.getmtime(f))<300 else 1)"
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        # ── sched: scripts/scheduler.py — cron replacement, fires the below ────
        # (poly-board hourly, poly-judgment 4h, autonomous-cycle daily,
        # trends-price 30min, trends-recorders 6h — see scripts/scheduler.py:JOBS)
        - name: sched
          image: hermes-trader:local
          imagePullPolicy: IfNotPresent
          args: ["python3", "scripts/scheduler.py"]
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          # No HTTP, and no reliable file-freshness signal either — jobs run
          # on independent clocks from 30min to 6h, so a "last write" check
          # would false-positive on the longest-interval job for hours after
          # a clean boot. Same precedent as `loop`: a process crash IS the
          # failure signal: restartPolicy Always restarts it, and each job's
          # own last_run timestamp makes a restart catch up rather than skip
          # (scripts/scheduler.py:is_due).
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        # ── rotator: scripts/log_rotate.py --daemon ─────────────────────────────
        # `sched` writes its fired jobs' stdout/stderr to real files under
        # logs/ (scripts/scheduler.py:run_job opens them directly — this is
        # independent of shell `nohup >>` wrapping, so it happens whether or
        # not restart.sh is involved). This container truncates them in
        # place on an interval so a long-lived pod's logs/ doesn't grow
        # unbounded; see hermes_trader/log_setup.py for the policy. Logs live
        # in the container's own writable layer, deliberately NOT on the
        # shared /data volume — log history isn't state that needs the same
        # backup/rollback guarantees as .state/ or shadow_ledger/, and
        # keeping it off the volume keeps the one singleton-sensitive PVC
        # smaller. No probe: same "process crash is the signal" precedent.
        - name: rotator
          image: hermes-trader:local
          imagePullPolicy: IfNotPresent
          args: ["python3", "scripts/log_rotate.py", "--daemon"]
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secrets
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
