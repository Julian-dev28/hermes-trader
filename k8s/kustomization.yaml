apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes

# Core app only — applies cleanly with `kubectl apply -k k8s/` on any cluster.
# servicemonitor.yaml and prometheusrule.yaml are intentionally excluded (they
# need the Prometheus Operator CRDs). Both live in the monitoring overlay:
#
#     kubectl apply -k k8s/              # core, works anywhere
#     kubectl apply -k k8s/monitoring/   # after kube-prometheus-stack
#
# The Secret is created imperatively from .env.local — see k8s/README.md.
resources:
  - namespace.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
