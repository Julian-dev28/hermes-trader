apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes

# Scrape config + alert rules. Separate from the base on purpose: both depend on
# the Prometheus Operator CRDs, and putting them in the base would break
# `kubectl apply -k k8s/` on a cluster that does not have them.
#
#     kubectl apply -k k8s/monitoring/
#
# Install kube-prometheus-stack first.
resources:
  - ../servicemonitor.yaml
  - ../prometheusrule.yaml
