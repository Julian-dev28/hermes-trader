<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hermes-trader · activity</title>
<script src="/static/tailwind.js"></script>
<style>
  /* ── design system: sans for words, mono/pixel identity in wordmark +
     section labels; signature indigo→violet gradient reserved for wordmark
     mark, active nav, LIVE badges. Green/red = money + direction only. ── */
  :root{
    --card:#14161b; --card2:#181b21;
    --line:#23262e; --line2:#2c313c;
    --txt:#e8eaf0; --mut:#9aa1ad; --dim:#5c6370; --faint:#3d434e;
    --up:#22c55e; --dn:#ef4444; --ind:#818cf8; --amb:#f59e0b; --teal:#2dd4bf;
    --vio:#8b5cf6;
    --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a855f7 100%);
  }
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);
    background:#0a0b0d;
    background-image:radial-gradient(1100px 520px at 50% -160px,#16141f 0%,#0e1014 50%,#0a0b0d 100%);
    background-repeat:no-repeat;background-attachment:fixed;
  }
  .mono,.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .brand{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;font-size:15px;letter-spacing:.16em;color:var(--txt)}
  .brand .dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--grad);margin-right:10px;box-shadow:0 0 12px rgba(139,92,246,.65)}
  .brand small{color:var(--dim);font-weight:600;letter-spacing:.18em;font-size:10px}
  .nav-link{display:inline-block;padding:6px 14px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mut);border-radius:3px;text-decoration:none;border:1px solid transparent}
  .nav-link:hover{color:var(--txt);background:var(--card)}
  .nav-link:active{transform:translateY(1px)}
  .nav-link.nav-active{color:var(--txt);background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(168,85,247,.16));border-color:rgba(139,92,246,.45)}
  /* scanline texture behind the header — very low opacity, pure CSS */
  header{position:relative}
  header::after{content:'';position:absolute;inset:-14px -20px;pointer-events:none;z-index:-1;
        background:repeating-linear-gradient(0deg,rgba(139,92,246,.05) 0 1px,transparent 1px 4px)}
  /* geometric glyphs — no emoji anywhere */
  .gi{display:inline-block;vertical-align:0}
  .gi-hb{width:7px;height:7px;border-radius:2px;background:var(--up);opacity:.75}
  .gi-stop{width:7px;height:7px;border-radius:1px;background:var(--dn);opacity:.8}
  .gi-restart{width:9px;height:9px;border:1.5px solid var(--mut);border-radius:999px;border-top-color:transparent;vertical-align:-1px}
  .tk{display:inline-block;padding:1px 9px;border-radius:3px;background:#1d212b;border:1px solid var(--line2);color:#f4f6fa;font-weight:700;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;white-space:nowrap;vertical-align:baseline}
  .badge{display:inline-block;padding:1px 8px;font-size:10px;font-weight:700;letter-spacing:.08em;border-radius:3px;border:1px solid transparent;white-space:nowrap}
  .b-long{color:#86efac;background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.35)}
  .b-short{color:#fca5a5;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35)}
  .b-ok{color:#86efac;background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.35)}
  .b-fail{color:#fca5a5;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35)}
  .b-pass{color:var(--mut);background:#1d212b;border-color:var(--line2)}
  .b-live{color:#e4defc;background:linear-gradient(135deg,rgba(99,102,241,.28),rgba(168,85,247,.28));border-color:rgba(139,92,246,.5)}
  .b-shadow{color:#fcd34d;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3)}
  .chip{display:inline-block;padding:2px 9px;font-size:10.5px;border-radius:3px;border:1px solid var(--line2);background:#171a20;color:var(--mut);margin:2px 5px 2px 0;white-space:nowrap}
  .chip.chip-red{border-color:rgba(239,68,68,.35);color:#fca5a5;background:rgba(239,68,68,.08)}
  .chip.chip-amber{border-color:rgba(245,158,11,.35);color:#fcd34d;background:rgba(245,158,11,.08)}
  /* ── session strip: KPI chips, sticky, blur + soft violet glow ── */
  .strip{position:sticky;top:10px;z-index:20;display:flex;gap:2px;flex-wrap:wrap;align-items:stretch;
         background:rgba(14,16,20,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
         border:1px solid var(--line);border-radius:4px;padding:10px 8px;margin-bottom:18px;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.03),4px 4px 0 rgba(0,0,0,.45),0 0 70px -25px rgba(139,92,246,.4)}
  .kpi{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 14px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi .v{font-size:18px;font-weight:750;line-height:1.15;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt)}
  .kpi .l{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .kpi .v.pos{color:var(--up)}.kpi .v.neg{color:var(--dn)}
  /* ── the flight deck: four independent flowing panes ── */
  .deck{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:1024px){.deck{grid-template-columns:1fr 1fr}}
  .pane{background:var(--card);border:1px solid var(--line);border-radius:3px;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.03),4px 4px 0 rgba(0,0,0,.45);
        display:flex;flex-direction:column;min-height:180px}
  .pane-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .pane-head .sec-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .pane-head .pm{width:7px;height:7px;border-radius:1px}
  .pane-head .pm.pm-trade{background:var(--up)}
  .pane-head .pm.pm-research{background:var(--ind)}
  .pane-head .pm.pm-books{background:var(--teal)}
  .pane-head .pm.pm-machine{background:var(--faint)}
  .pane-head .pmeta{margin-left:auto;font-size:10px;color:var(--dim)}
  .pane-flow{flex:1;overflow-y:auto;max-height:420px;padding:12px 14px}
  .pane-flow::-webkit-scrollbar{width:8px}
  .pane-flow::-webkit-scrollbar-track{background:#101216}
  .pane-flow::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
  .pane-empty{font-size:12px;color:var(--dim);padding:10px 2px;line-height:1.7}
  /* T1: full cards with semantic accent bar */
  .ev{background:var(--card2);border:1px solid var(--line);border-left-width:4px;border-radius:3px;
      padding:10px 13px;margin-bottom:10px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
      transition:transform .15s ease,border-color .15s ease}
  .ev:hover{transform:translate(-1px,-1px);border-color:var(--line2)}
  .ev.acc-green{border-left-color:var(--up)}
  .ev.acc-red{border-left-color:var(--dn)}
  .ev.acc-indigo{border-left-color:var(--ind)}
  .ev.acc-teal{border-left-color:var(--teal)}
  .ev-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;color:#cfd4dd}
  .ev-head b{color:var(--txt);font-weight:750}
  .ev-ts{color:var(--dim);font-size:10.5px;white-space:nowrap}
  .ev-body{font-size:12.5px;color:#cfd4dd;margin-top:5px;line-height:1.6;word-break:break-word}
  .ev-sub{font-size:11px;color:var(--dim);margin-top:3px}
  .pnl{font-size:13.5px;font-weight:800}
  .pnl.pos{color:var(--up)}.pnl.neg{color:var(--dn)}
  /* T2: one-line log entries */
  .ev-line{font-size:12px;color:var(--mut);padding:3px 2px;margin-bottom:6px;line-height:1.65;word-break:break-word}
  .ev-line b{color:#cfd4dd;font-weight:650}
  /* T3 fresh: individual slim rows — the constant flow */
  .ev-fresh{font-size:11.5px;color:var(--mut);padding:2px 2px;margin-bottom:5px;line-height:1.6;opacity:.62;word-break:break-word;max-height:64px;overflow:hidden;
            transition:max-height .4s ease,opacity .35s ease,margin .4s ease,padding .4s ease}
  .ev-fresh b{color:var(--mut);font-weight:650}
  .ev-fresh:hover{opacity:.95}
  .ev-fold{max-height:0 !important;opacity:0 !important;margin-bottom:0 !important;padding-top:0 !important;padding-bottom:0 !important}
  /* T3 aged: coalesced history */
  .ev-coal{font-size:11px;color:var(--mut);padding:2px 2px;margin-bottom:5px;line-height:1.65;opacity:.55;transition:opacity .15s ease}
  .ev-coal:hover{opacity:.9}
  .ev-coal b{color:var(--mut);font-weight:650}
  .ev-coal .cnt{color:#fcd34d;font-weight:750}
  .ev-coal .tk{opacity:.9;font-size:10px;padding:0 8px}
  .ev-div{display:flex;align-items:center;gap:10px;margin:8px 0 10px;opacity:.65}
  .ev-div::before,.ev-div::after{content:'';flex:1;height:1px;background:var(--line)}
  .ev-div .dv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
              background:#12141a;border:1px solid var(--line);border-radius:3px;padding:2px 10px;white-space:nowrap}
  /* ── arrival animations — CSS only, reduced-motion respected ── */
  .ev-enter{animation:ev-in .5s cubic-bezier(.2,.7,.3,1)}
  @keyframes ev-in{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:none}}
  .ev-fresh.ev-enter{animation:fresh-in .5s cubic-bezier(.2,.7,.3,1)}
  @keyframes fresh-in{0%{opacity:0;transform:translateY(-8px)}100%{opacity:.62;transform:none}}
  .flash-green{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-g 1.8s ease-out}
  @keyframes glow-g{0%{border-color:var(--up);box-shadow:0 0 18px rgba(34,197,94,.4);background:#0d2416}100%{}}
  .flash-red{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-r 1.8s ease-out}
  @keyframes glow-r{0%{border-color:var(--dn);box-shadow:0 0 18px rgba(239,68,68,.4);background:#2b0e0e}100%{}}
  .flash-indigo{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-i 1.5s ease-out}
  @keyframes glow-i{0%{border-color:var(--ind);box-shadow:0 0 14px rgba(129,140,248,.35);background:#15162d}100%{}}
  .coal-tick{animation:coal-tick .6s ease-out}
  @keyframes coal-tick{0%{opacity:1;color:#d3f9e4}100%{opacity:.55}}
  select.fsel{background:#12141a;border:1px solid var(--line);border-radius:3px;color:var(--mut);font-size:11px;font-weight:600;padding:4px 8px}
  /* citation source chips — a small pill, not a blue underlined link, but
     still unmistakably clickable (dot marker + hover lift + brand accent) */
  .cite-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  a.cite{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;
    background:#171a20;border:1px solid var(--line2);color:var(--mut);
    font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    text-decoration:none;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;
    transition:color .15s ease,border-color .15s ease,background .15s ease,transform .15s ease}
  a.cite::before{content:'';width:5px;height:5px;border-radius:1px;background:var(--vio);opacity:.65;flex-shrink:0}
  a.cite:hover{color:var(--txt);border-color:var(--vio);background:#1d1930;transform:translateY(-1px)}
  a.cite:hover::before{opacity:1;box-shadow:0 0 6px rgba(139,92,246,.7)}
  /* ── the pixel cat (same mascot as the dashboard, every tab) ── */
  .cat{width:28px;height:28px;display:inline-block;margin-right:9px}
  .cat svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
  .cat .c-ears-p,.cat .c-ears-f,.cat .c-eyes-w,.cat .c-eyes-c,.cat .c-zzz{display:none}
  .cat.cat-alert .c-ears-n,.cat.cat-alert .c-eyes-n{display:none}
  .cat.cat-alert .c-ears-p,.cat.cat-alert .c-eyes-w{display:block}
  .cat.cat-sad .c-ears-n{display:none}
  .cat.cat-sad .c-ears-f{display:block}
  .cat.cat-sleep .c-eyes-n,.cat.cat-sleep .c-eyes-w{display:none}
  .cat.cat-sleep .c-eyes-c,.cat.cat-sleep .c-zzz{display:block}
  .cat .c-tail-a{animation:tail-a 1.4s steps(1) infinite}
  .cat .c-tail-b{animation:tail-b 1.4s steps(1) infinite}
  @keyframes tail-a{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes tail-b{0%,49%{opacity:0}50%,100%{opacity:1}}
  .cat.cat-sleep .c-tail-a{animation:none;opacity:1}
  .cat.cat-sleep .c-tail-b{animation:none;opacity:0}
  .cat.cat-sleep svg{animation:cat-breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes cat-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.93)}}
  .cat .c-zzz rect{animation:zzz 2.4s steps(1) infinite}
  .cat .c-zzz rect:nth-child(2){animation-delay:.8s}
  .cat .c-zzz rect:nth-child(3){animation-delay:1.6s}
  @keyframes zzz{0%,60%{opacity:1}61%,100%{opacity:.15}}
  .cat.cat-bounce{animation:cat-bounce .7s cubic-bezier(.3,1.8,.4,1)}
  @keyframes cat-bounce{0%{transform:translateY(0)}35%{transform:translateY(-6px)}70%{transform:translateY(1px)}100%{transform:none}}
  /* ── skeleton shimmer: modern loading state, replaces "loading…" text ── */
  .skeleton{position:relative;overflow:hidden;background:#171a20;border-radius:3px;color:transparent !important;display:inline-block;min-width:64px}
  .skeleton::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(139,92,246,.14),transparent);
    animation:shimmer 1.6s ease-in-out infinite}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  /* ── KPI value-change flash (session strip), same language as tick-up/dn ── */
  .kpi .v.tick-up{animation:kpi-tick-g .9s ease-out}
  .kpi .v.tick-dn{animation:kpi-tick-r .9s ease-out}
  @keyframes kpi-tick-g{0%{color:#86efac}100%{}}
  @keyframes kpi-tick-r{0%{color:#fca5a5}100%{}}
  @media (prefers-reduced-motion: reduce){
    .ev-enter,.flash-green,.flash-red,.flash-indigo,.coal-tick,.ev-fresh.ev-enter{animation:none}
    .ev,.ev-coal,.ev-fresh{transition:none}
    .cat .c-tail-a,.cat .c-tail-b,.cat.cat-sleep svg,.cat .c-zzz rect,.cat.cat-bounce{animation:none}
    .skeleton::after,.kpi .v.tick-up,.kpi .v.tick-dn{animation:none}
  }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-[1240px] mx-auto px-6 py-6">

  <header class="flex items-center justify-between mb-5 gap-3 flex-wrap">
    <span class="brand flex items-center">
      <span id="pixel-cat" class="cat" title="the cat watches the tape">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g class="c-ears-n">
            <rect x="3" y="1" width="1" height="1" fill="#f4f6fa"/><rect x="3" y="2" width="2" height="1" fill="#f4f6fa"/><rect x="3" y="3" width="3" height="1" fill="#f4f6fa"/>
            <rect x="12" y="1" width="1" height="1" fill="#f4f6fa"/><rect x="11" y="2" width="2" height="1" fill="#f4f6fa"/><rect x="10" y="3" width="3" height="1" fill="#f4f6fa"/>
            <rect x="4" y="3" width="1" height="1" fill="#f0abfc"/><rect x="11" y="3" width="1" height="1" fill="#f0abfc"/>
          </g>
          <g class="c-ears-p">
            <rect x="3" y="0" width="1" height="1" fill="#f4f6fa"/><rect x="3" y="1" width="2" height="1" fill="#f4f6fa"/><rect x="3" y="2" width="3" height="2" fill="#f4f6fa"/>
            <rect x="12" y="0" width="1" height="1" fill="#f4f6fa"/><rect x="11" y="1" width="2" height="1" fill="#f4f6fa"/><rect x="10" y="2" width="3" height="2" fill="#f4f6fa"/>
            <rect x="4" y="2" width="1" height="1" fill="#f0abfc"/><rect x="11" y="2" width="1" height="1" fill="#f0abfc"/>
          </g>
          <g class="c-ears-f">
            <rect x="2" y="3" width="4" height="1" fill="#f4f6fa"/><rect x="10" y="3" width="4" height="1" fill="#f4f6fa"/>
          </g>
          <rect x="2" y="4" width="12" height="9" fill="#f4f6fa"/>
          <g class="c-eyes-n">
            <rect x="4" y="7" width="2" height="2" fill="#22c55e"/><rect x="10" y="7" width="2" height="2" fill="#60a5fa"/>
          </g>
          <g class="c-eyes-w">
            <rect x="4" y="6" width="2" height="3" fill="#22c55e"/><rect x="10" y="6" width="2" height="3" fill="#60a5fa"/>
          </g>
          <g class="c-eyes-c">
            <rect x="4" y="8" width="2" height="1" fill="#5c6370"/><rect x="10" y="8" width="2" height="1" fill="#5c6370"/>
          </g>
          <rect x="7" y="10" width="2" height="1" fill="#f0abfc"/>
          <rect x="0" y="10" width="2" height="1" fill="#5c6370"/><rect x="14" y="10" width="2" height="1" fill="#5c6370"/>
          <rect x="2" y="12" width="12" height="1" fill="#8b5cf6"/>
          <rect x="3" y="14" width="2" height="1" fill="#c9ced8"/><rect x="11" y="14" width="2" height="1" fill="#c9ced8"/>
          <g class="c-tail-a"><rect x="14" y="12" width="1" height="1" fill="#f4f6fa"/><rect x="15" y="11" width="1" height="1" fill="#f4f6fa"/></g>
          <g class="c-tail-b"><rect x="14" y="12" width="1" height="1" fill="#f4f6fa"/><rect x="15" y="13" width="1" height="1" fill="#f4f6fa"/></g>
          <g class="c-zzz">
            <rect x="12" y="2" width="1" height="1" fill="#8b5cf6"/><rect x="13" y="1" width="1" height="1" fill="#a78bfa"/><rect x="14" y="0" width="1" height="1" fill="#c4b5fd"/>
          </g>
        </svg>
      </span>
      <span class="dot"></span>HERMES-TRADER&nbsp;<small>/ ACTIVITY</small>
    </span>
    <span class="text-[10px] mono" style="color:var(--dim)" id="feed-meta"></span>
  </header>

  <nav class="flex items-center gap-1 mb-5 flex-wrap">
    <a href="/" data-nav="/" class="nav-link">DASHBOARD</a>
    <a href="/activity" data-nav="/activity" class="nav-link">ACTIVITY</a>
    <a href="/news" data-nav="/news" class="nav-link">NEWS</a>
    <a href="/analytics" data-nav="/analytics" class="nav-link">ANALYTICS</a>
  </nav>

  <div class="strip" id="session-strip">
    <div class="kpi"><span class="v">…</span><span class="l">last 6h</span></div>
  </div>

  <!-- the flight deck: four independent flowing windows. The panes ARE the
       type separation — no filter chips. -->
  <div class="deck">
    <section class="pane" id="pane-trade">
      <div class="pane-head"><span class="pm pm-trade"></span><span class="sec-label">trade log</span><span class="pmeta mono" id="meta-trade"></span></div>
      <div class="pane-flow" id="flow-trade"></div>
    </section>
    <section class="pane" id="pane-research">
      <div class="pane-head"><span class="pm pm-research"></span><span class="sec-label">research log</span><span class="pmeta mono" id="meta-research"></span></div>
      <div class="pane-flow" id="flow-research"></div>
    </section>
    <section class="pane" id="pane-books">
      <div class="pane-head"><span class="pm pm-books"></span><span class="sec-label">books</span>
        <select id="book-filter" class="fsel" style="margin-left:auto"><option value="">all books</option></select>
      </div>
      <div class="pane-flow" id="flow-books"></div>
    </section>
    <section class="pane" id="pane-machine">
      <div class="pane-head"><span class="pm pm-machine"></span><span class="sec-label">machine</span><span class="pmeta mono" id="meta-machine"></span></div>
      <div class="pane-flow" id="flow-machine"></div>
    </section>
  </div>

  <footer class="text-[10px] mt-8 text-center" style="color:var(--dim)">
    one wallet · live · not financial advice
  </footer>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = ms => { const d = new Date(ms || Date.now()); return d.toTimeString().slice(0, 8); };
const fmtHM = ms => { const d = new Date(ms || Date.now()); return d.toTimeString().slice(0, 5); };
const fmtDur = ms => {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
};
const fmtNum = v => {

const tk = c => c ? `<span class="tk">${esc(c)}</span>` : '';

// ── citation chips: source pills, not blue underlined links ─────────────────

// ── PANE ROUTING: the panes are the type separation ─────────────────────────

function accentClass(e) {

// ── TIER 2 flight-log lines ──────────────────────────────────────────────────
// books pane: every cycle reads like a log sentence
function bookCycleText(e) {

// ── TIER 3 fresh rows: individual, human, inside their pane ─────────────────
let FRESH_MS = 15 * 60 * 1000;

function freshText(e) {

    return `${tk(e.coin)} entry refused — ${esc(e.human || e.reason || 'gate')}`;

      typeof c === 'object' ? c.coin : String(c)).join(', ');

  }

}

// ── TIER 3 aged: coalesced groups, human copy ────────────────────────────────
const coalIndex = new Map();

function coalLabel(kind, st) {

    return `${tk(st.coin)} entry refused <span class="cnt mono">×${st.n}</span> — ${esc(st.human || st.reason || 'gate')} · <span class="mono">${fmtHM(st.t0)}→${fmtHM(st.t1)}</span>`;
  if (kind === 'quiet')
    return `<b>${esc(st.book)}</b> — <span class="cnt mono">${st.n}</span> quiet cycle${st.n === 1 ? '' : 's'}, nothing met the entry bar · <span class="mono">${fmtHM(st.t0)}→${fmtHM(st.t1)}</span>`;
  if (kind === 'scan') {
    const h = st.hour * 3600000;
    return `<span class="dv">${fmtHM(h)}–${fmtHM(h + 3600000)} · ${st.n} scans · ${st.triggers} candidates · ${st.researched} researched · ${st.trades} trades</span>`;
  }

    return `<span class="dv">steady · $${Number(st.equity ?? 0).toFixed(2)} · ${st.open ?? 0} open · ${fmtDur(st.t1 - st.t0)}</span>`;

  el.dataset.st = JSON.stringify(st);

}
function coalMerge(el, patch, animate, floatTop) {
  const st = coalState(el);

  st.t0 = Math.min(st.t0, patch.t0 || st.t0);
  if (patch.triggers) st.triggers = (st.triggers || 0) + patch.triggers;
  if (patch.equity !== undefined) st.equity = patch.equity;
  if (patch.open !== undefined) st.open = patch.open;
  el.dataset.st = JSON.stringify(st);
  coalRender(el);
  if (floatTop && el.parentElement && el.parentElement.firstElementChild !== el) el.parentElement.prepend(el);

  if (!el) return;
  const st = coalState(el);
  st[field] = (st[field] || 0) + 1;
  el.dataset.st = JSON.stringify(st);

// heartbeat state machine — aged path only (initial history + folds)
let lastHB = null;

function routeHeartbeat(e) {
  const eq = Number(e.equity ?? 0), open = Number(e.open_positions ?? 0);
  const changed = !lastHB || Math.abs(eq - lastHB.equity) > 0.05 || open !== lastHB.open;
  lastHB = { equity: eq, open };
  if (changed) {
    steadyRun++;
    const div = document.createElement('div');
    div.className = 'ev-line';
    div.innerHTML = `${T(e)} ${GI_HB} equity <b class="mono">$${eq.toFixed(2)}</b> · daily <span class="mono">$${Number(e.daily_pnl ?? 0).toFixed(2)}</span> · ${open} open`;
    return { node: div };

function groupPlan(e) {

    return { gkey: e.gkey, kind: 'gate',

  if (e.type === 'scan')
    return { gkey: e.gkey, kind: 'scan',
             st: { n: 1, t0: e.ts, t1: e.ts, hour: Math.floor((e.ts || 0) / 3600000),
                   triggers: Number(e.triggers || 0), researched: 0, trades: 0 } };

// ── stream state ─────────────────────────────────────────────────────────────
const seen = new Set();
const seenOrder = [];
let newestTs = 0;
let curBook = '';

const keyOf = e => `${e.ts}|${e.type}|${e.coin || e.book || e.name || ''}|${String(e.reason || e.verdict || e.error || '').slice(0, 24)}`;
function remember(e) {
  const k = keyOf(e);
  if (seen.has(k)) return false;
  seen.add(k); seenOrder.push(k);
  while (seenOrder.length > 2500) seen.delete(seenOrder.shift());
  if ((e.ts || 0) > newestTs) newestTs = e.ts;
  return true;
}

function clearEmpty(flow) {
  const p = flow.querySelector('.pane-empty');
  if (p) p.remove();
}
function applyBookFilter(node) {
  if (node.dataset.book !== undefined) {
    node.style.display = (!curBook || node.dataset.book === curBook) ? '' : 'none';
  }
}
function insertTop(flow, node, animate, cls) {
  clearEmpty(flow);
  if (animate) node.classList.add(cls || 'ev-enter');
  flow.prepend(node);
  applyBookFilter(node);
  while (flow.children.length > 150) {
    const last = flow.lastElementChild;
    if (last.dataset && last.dataset.gkey) coalIndex.delete(last.dataset.gkey);
    last.remove();
  }
}

// One event, chronological order in → one mutation at the top of its pane.
function ingest(e, animate) {
  if (!remember(e)) return;
  if (e.type === 'research') bumpHourStats(e, 'researched');
  if (e.type === 'execute' && e.executed) bumpHourStats(e, 'trades');
  const flow = FLOWS[paneFor(e)];

  if (e.tier === 3) {
    const isFresh = e.fresh && (e.ts || 0) >= Date.now() - FRESH_MS;
    if (isFresh) {
      insertTop(flow, freshNode(e), animate);
      return;
    }
    let gkey, kind, st;
    if (e.type === 'heartbeat') {
      const r = routeHeartbeat(e);
      if (r.node) { insertTop(flow, r.node, animate); return; }
      gkey = r.gkey; kind = r.kind; st = r.st;
    } else {
      const plan = groupPlan(e);
      gkey = plan.gkey; kind = plan.kind; st = plan.st;
    }
    const existing = coalIndex.get(gkey);
    if (existing) {
      coalMerge(existing, { t0: e.ts, t1: e.ts, triggers: st.triggers,
                            equity: st.equity, open: st.open }, animate, true);
    } else {
      insertTop(flow, coalNode(kind, gkey, st), animate);
    }
    return;
  }

  const node = e.tier === 1 ? cardNode(e) : lineNode(e);
  insertTop(flow, node, animate, e.tier === 1 ? emphasisClass(e) : 'ev-enter');
}

// ── time-decay fold: fresh rows that aged out slide into their groups ───────
const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  el.classList.add('ev-fold');
  setTimeout(() => el.remove(), 450);
}

    const existing = coalIndex.get(r.gkey);
    if (existing) {
      coalMerge(existing, { t0: e.ts, t1: e.ts, equity: r.st.equity, open: r.st.open }, true, false);
      removeFolded(el);
    } else {
      el.replaceWith(coalNode(r.kind, r.gkey, r.st));
    }
    return;
  }
  const plan = groupPlan(e);
  const existing = coalIndex.get(plan.gkey);
  if (existing) {
    coalMerge(existing, { t0: e.ts, t1: e.ts, triggers: plan.st.triggers }, true, false);
    removeFolded(el);

  }

  for (let i = nodes.length - 1; i >= 0; i--) {   // oldest first, per chronology
    const el = nodes[i];
    let e;
    try { e = JSON.parse(el.dataset.ev); } catch { el.remove(); continue; }
    if ((e.ts || 0) >= cutoff) continue;
    foldOne(el, e);
  }

// ── empty states per pane ────────────────────────────────────────────────────
function paneEmpties(session) {
  const since = session && session.since_ts ? fmtHM(session.since_ts) : '—';
  const scans = session ? session.scans : 0;
  const blocks = session ? session.blocks : 0;
  const copy = {
    trade: `nothing actionable since ${since} — engine scanning normally (${scans} scans, ${blocks} blocks)`,
    research: 'no verdicts yet in this window',
    books: 'no book cycles yet in this window',
    machine: 'quiet',
  };
  for (const [name, flow] of Object.entries(FLOWS)) {
    if (!flow.children.length) {
      const d = document.createElement('div');
      d.className = 'pane-empty';
      d.textContent = copy[name];
      flow.appendChild(d);
    }
  }
}

// ── session strip ────────────────────────────────────────────────────────────

}

    kpiChip('candidates', 'candidates', s.candidates) +
    kpiChip('researched', 'researched', s.researched) +
    kpiChip('opened', 'opened', s.opened) +
    kpiChip('closed', 'closed', s.closed) +
    kpiChip('realized', 'realized', fmtPct(pnl), pnlCls) +
    kpiChip('equity', 'equity', s.equity != null ? '$' + Number(s.equity).toFixed(2) : '—') +
    kpiChip('open', 'open', s.open_positions != null ? s.open_positions : '—');
  flashChanged(el);
}

// ── load + poll ──────────────────────────────────────────────────────────────
function setMeta() {
  document.getElementById('feed-meta').textContent =
    `flight deck · newest first · updated ${fmtTime(Date.now())}`;
}

async function fullLoad() {
  const data = await (await fetch('/api/dashboard/activity?limit=300')).json();
  if (data.fresh_window_s) FRESH_MS = data.fresh_window_s * 1000;
  buildBookFilter(data);
  renderStrip(data.session);
  for (const flow of Object.values(FLOWS)) flow.innerHTML = '';
  coalIndex.clear(); seen.clear(); seenOrder.length = 0;
  newestTs = 0; lastHB = null; steadyRun = 0;
  const chrono = (data.events || []).slice().reverse();   // oldest → newest
  for (const e of chrono) ingest(e, false);
  paneEmpties(data.session);
  setMeta();
}

async function pollNew() {
  if (!newestTs) return fullLoad().catch(() => {});
  try {
    const data = await (await fetch('/api/dashboard/activity?limit=100&since=' + (newestTs - 1))).json();
    renderStrip(data.session);
    const chrono = (data.events || []).slice().reverse();
    for (const e of chrono) ingest(e, true);
    foldAged();
    setMeta();
  } catch (e) {}
}

// book dropdown — scoped to the BOOKS pane only (client-side visibility)
function buildBookFilter(data) {
  const sel = document.getElementById('book-filter');
  if (sel.childElementCount > 1) return;
  for (const b of (data.books || [])) {
    const o = document.createElement('option');
    o.value = b; o.textContent = b;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => {
    curBook = sel.value;
    for (const node of FLOWS.books.children) applyBookFilter(node);
  });
}

(function () {
  const here = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('a[data-nav]').forEach(a => {
    if (a.dataset.nav === here) a.classList.add('nav-active');
  });
})();

FLOWS.trade = document.getElementById('flow-trade');
FLOWS.research = document.getElementById('flow-research');
FLOWS.books = document.getElementById('flow-books');
FLOWS.machine = document.getElementById('flow-machine');

fullLoad().catch(() => {
  FLOWS.trade.innerHTML = '<div class="pane-empty">feed load failed — is the server up?</div>';
});
setInterval(pollNew, 8000);
setInterval(foldAged, 20000);

// ── the cat reacts to the tape (same mascot + logic as the dashboard) ──────
let catLastEquity = null;
function updateCat(s) {
  const cat = document.getElementById('pixel-cat');
  if (!cat) return;
  cat.classList.remove('cat-sleep', 'cat-sad', 'cat-alert');
  if (s.status !== 'scanning') cat.classList.add('cat-sleep');
  else if ((s.daily_pnl ?? 0) < 0) cat.classList.add('cat-sad');
  else if ((s.open_positions ?? 0) > 0) cat.classList.add('cat-alert');
  if (catLastEquity != null && (s.equity ?? 0) > catLastEquity + 0.004) {
    cat.classList.remove('cat-bounce');
    void cat.offsetWidth;
    cat.classList.add('cat-bounce');
  }
  catLastEquity = s.equity ?? catLastEquity;
}
async function refreshCat() {
  try { updateCat(await (await fetch('/api/dashboard/summary')).json()); } catch (e) {}
}
refreshCat();
setInterval(refreshCat, 20000);
</script>
