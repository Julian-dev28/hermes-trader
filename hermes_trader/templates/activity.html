<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hermes-trader · activity</title>
<script src="/static/tailwind.js"></script>
<style>
  /* ── design tokens: sans for words, mono for numbers/tickers/time.
     The ONLY saturated green/red on the page is money + direction. ── */
  :root{
    --card:#14161b; --card2:#181b21;
    --line:#23262e; --line2:#2c313c;
    --txt:#e8eaf0; --mut:#9aa1ad; --dim:#5c6370; --faint:#3d434e;
    --up:#22c55e; --dn:#ef4444; --ind:#818cf8; --amb:#f59e0b; --teal:#2dd4bf;
  }
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);
    background:#0a0b0d;
    background-image:radial-gradient(1100px 520px at 50% -160px,#181c24 0%,#0e1014 50%,#0a0b0d 100%);
    background-repeat:no-repeat;background-attachment:fixed;
  }
  .mono,.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  /* brand + nav */
  .brand{font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--txt)}
  .brand .dot{display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--up);margin-right:9px;vertical-align:2px;box-shadow:0 0 8px rgba(34,197,94,.7)}
  .brand small{color:var(--dim);font-weight:600;letter-spacing:.18em;font-size:10px}
  .nav-link{display:inline-block;padding:6px 14px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mut);border-radius:8px;text-decoration:none;border:1px solid transparent}
  .nav-link:hover{color:var(--txt);background:var(--card)}
  .nav-link.nav-active{color:var(--txt);background:var(--card2);border-color:var(--line2)}
  /* ticker chip — the eye's anchor for every coin symbol */
  .tk{display:inline-block;padding:1px 9px;border-radius:999px;background:#1d212b;border:1px solid var(--line2);color:#f4f6fa;font-weight:700;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;white-space:nowrap;vertical-align:baseline}
  /* badges: direction gets the saturated colors, everything else stays cool */
  .badge{display:inline-block;padding:1px 8px;font-size:10px;font-weight:700;letter-spacing:.08em;border-radius:999px;border:1px solid transparent;white-space:nowrap}
  .b-long{color:#86efac;background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.35)}
  .b-short{color:#fca5a5;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35)}
  .b-ok{color:#86efac;background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.35)}
  .b-fail{color:#fca5a5;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35)}
  .b-pass{color:var(--mut);background:#1d212b;border-color:var(--line2)}
  .b-live{color:#86efac;background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3)}
  .b-shadow{color:#fcd34d;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3)}
  .chip{display:inline-block;padding:2px 9px;font-size:10.5px;border-radius:999px;border:1px solid var(--line2);background:#171a20;color:var(--mut);margin:2px 5px 2px 0;white-space:nowrap}
  .chip.chip-red{border-color:rgba(239,68,68,.35);color:#fca5a5;background:rgba(239,68,68,.08)}
  .chip.chip-amber{border-color:rgba(245,158,11,.35);color:#fcd34d;background:rgba(245,158,11,.08)}
  /* ── session strip: KPI chips, sticky with blur + elevation ── */
  .strip{position:sticky;top:10px;z-index:20;display:flex;gap:2px;flex-wrap:wrap;align-items:stretch;
         background:rgba(14,16,20,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
         border:1px solid var(--line);border-radius:14px;padding:10px 8px;margin-bottom:18px;
         box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .kpi{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 14px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi .v{font-size:18px;font-weight:750;line-height:1.15;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt)}
  .kpi .l{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .kpi .v.pos{color:var(--up)}.kpi .v.neg{color:var(--dn)}
  /* ── the journal: timeline rail + three visual weights ── */
  #feed{position:relative;border-left:2px solid var(--line);padding-left:18px}
  /* T1: elevated cards with a 4px semantic accent bar */
  .ev{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:10px;
      padding:12px 15px;margin-bottom:14px;position:relative;
      transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
  .ev:hover{transform:translateY(-1px);border-color:var(--line2);box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .ev::before{content:'';position:absolute;left:-25px;top:16px;width:9px;height:9px;border-radius:999px;background:var(--dim);border:2px solid #0a0b0d}
  .ev.acc-green{border-left-color:var(--up)}   .ev.acc-green::before{background:var(--up)}
  .ev.acc-red{border-left-color:var(--dn)}     .ev.acc-red::before{background:var(--dn)}
  .ev.acc-indigo{border-left-color:var(--ind)} .ev.acc-indigo::before{background:var(--ind)}
  .ev.acc-teal{border-left-color:var(--teal)}  .ev.acc-teal::before{background:var(--teal)}
  .ev-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .ev-ts{color:var(--dim);font-size:10.5px;white-space:nowrap}
  .ev-type{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .ev-type.t-research{color:var(--ind)}.ev-type.t-execute{color:#86efac}.ev-type.t-close{color:#fcd34d}
  .ev-type.t-book{color:var(--teal)}.ev-type.t-error{color:#fca5a5}
  .ev-body{font-size:13px;color:#cfd4dd;margin-top:5px;line-height:1.6;word-break:break-word}
  .ev-sub{font-size:11.5px;color:var(--dim);margin-top:3px}
  .pnl{font-size:14px;font-weight:800}
  .pnl.pos{color:var(--up)}.pnl.neg{color:var(--dn)}
  /* T2: base one-liners */
  .ev-line{font-size:12px;color:var(--mut);padding:4px 12px;margin-bottom:7px;border-left:2px solid var(--line2);line-height:1.7;word-break:break-word;position:relative}
  .ev-line::before{content:'';position:absolute;left:-24px;top:11px;width:6px;height:6px;border-radius:999px;background:var(--faint)}
  .ev-line b{color:#cfd4dd;font-weight:650}
  .ev-line.l-research{border-left-color:rgba(129,140,248,.5)}
  .ev-line.l-research::before{background:var(--ind)}
  .ev-line.l-book{border-left-color:rgba(45,212,191,.4)}
  .ev-line.l-book::before{background:var(--teal)}
  .ev-line .conf{color:var(--dim);font-size:11px}
  /* T3: coalesced noise — visibly recessed (~55%) */
  .ev-coal{font-size:11px;color:var(--mut);padding:3px 12px;margin-bottom:6px;border-left:2px solid var(--line);line-height:1.7;opacity:.55;transition:opacity .15s ease}
  .ev-coal:hover{opacity:.9}
  .ev-coal b{color:var(--mut);font-weight:650}
  .ev-coal .cnt{color:#fcd34d;font-weight:750}
  .ev-coal .tk{opacity:.9;font-size:10px;padding:0 8px}
  /* dividers: centered thin rule + small-caps chip */
  .ev-div{display:flex;align-items:center;gap:12px;margin:10px 0 12px;opacity:.65}
  .ev-div::before,.ev-div::after{content:'';flex:1;height:1px;background:var(--line)}
  .ev-div .dv{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
              background:#12141a;border:1px solid var(--line);border-radius:999px;padding:2px 12px;white-space:nowrap}
  .empty-tape{font-size:13px;color:var(--mut);padding:16px;border:1px dashed var(--line2);border-radius:10px;margin-bottom:12px;line-height:1.7}
  /* ── arrival animations — CSS only, reduced-motion respected ── */
  .ev-enter{animation:ev-in .5s cubic-bezier(.2,.7,.3,1)}
  @keyframes ev-in{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:none}}
  .flash-green{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-g 1.8s ease-out}
  @keyframes glow-g{0%{border-color:var(--up);box-shadow:0 0 18px rgba(34,197,94,.4);background:#0d2416}100%{}}
  .flash-red{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-r 1.8s ease-out}
  @keyframes glow-r{0%{border-color:var(--dn);box-shadow:0 0 18px rgba(239,68,68,.4);background:#2b0e0e}100%{}}
  .flash-indigo{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-i 1.5s ease-out}
  @keyframes glow-i{0%{border-color:var(--ind);box-shadow:0 0 14px rgba(129,140,248,.35);background:#15162d}100%{}}
  .coal-tick{animation:coal-tick .6s ease-out}
  @keyframes coal-tick{0%{opacity:1;color:#d3f9e4}100%{opacity:.55}}
  @media (prefers-reduced-motion: reduce){
    .ev-enter,.flash-green,.flash-red,.flash-indigo,.coal-tick{animation:none}
    .ev,.ev-coal{transition:none}
  }
  /* ── filters: one quiet segmented control ── */
  .seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:#12141a;border:1px solid var(--line);border-radius:10px;padding:3px}
  .fchip{padding:4px 12px;font-size:11px;font-weight:600;letter-spacing:.04em;background:transparent;border:0;border-radius:7px;color:var(--dim);cursor:pointer;transition:color .12s ease,background .12s ease}
  .fchip:hover{color:var(--txt)}
  .fchip.on{background:var(--card2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
  select.fsel{background:#12141a;border:1px solid var(--line);border-radius:10px;color:var(--mut);font-size:11px;font-weight:600;padding:6px 10px}
  a.cite{color:#7dd3fc;text-decoration:underline;word-break:break-all}
</style>
</head>
<body class="min-h-screen">
<div class="max-w-[980px] mx-auto px-6 py-6">

  <header class="flex items-center justify-between mb-5 gap-3 flex-wrap">
    <span class="brand"><span class="dot"></span>HERMES-TRADER <small>/ ACTIVITY</small></span>
    <span class="text-[10px] mono" style="color:var(--dim)" id="feed-meta"></span>
  </header>

  <nav class="flex items-center gap-1 mb-5 flex-wrap">
    <a href="/" data-nav="/" class="nav-link">DASHBOARD</a>
    <a href="/activity" data-nav="/activity" class="nav-link">ACTIVITY</a>
    <a href="/news" data-nav="/news" class="nav-link">NEWS</a>
  </nav>

  <div class="strip" id="session-strip">
    <div class="kpi"><span class="v">…</span><span class="l">last 6h</span></div>
  </div>

  <div class="flex items-center gap-3 flex-wrap mb-6" id="filter-bar">
    <span id="type-filters" class="seg"></span>
    <select id="book-filter" class="fsel"><option value="">all books</option></select>
  </div>

  <div id="feed"><div class="ev-coal">loading&hellip;</div></div>

  <footer class="text-[10px] mt-8 text-center" style="color:var(--dim)">
    one wallet · live · not financial advice
  </footer>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = ms => { const d = new Date(ms || Date.now()); return d.toTimeString().slice(0, 8); };
const fmtHM = ms => { const d = new Date(ms || Date.now()); return d.toTimeString().slice(0, 5); };
const fmtDay = ms => { const d = new Date(ms || Date.now()); return (d.getMonth() + 1) + '/' + d.getDate(); };
const fmtTs = ms => fmtDay(ms) + ' ' + fmtTime(ms);
const fmtDur = ms => {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
};
const fmtNum = v => {
  if (v == null || typeof v !== 'number' || !isFinite(v)) return String(v);
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return (v / 1e3).toFixed(1) + 'k';
  if (a >= 100) return v.toFixed(2);
  if (a >= 1) return v.toFixed(3);
  return v.toFixed(5);
};
const fmtPct = n => (n >= 0 ? '+' : '') + Number(n ?? 0).toFixed(2) + '%';

// Readable scalar for any value — no raw JSON, ever.
function readable(v, depth) {
  depth = depth || 0;
  if (v == null) return '—';
  if (typeof v === 'number') return fmtNum(v);
  if (typeof v !== 'object') return String(v);
  if (depth >= 2) return '…';
  if (Array.isArray(v)) {
    if (!v.length) return 'none';
    return v.map(x => readable(x, depth + 1)).join(', ');
  }
  return Object.entries(v).map(([k, x]) => `${k}: ${readable(x, depth + 1)}`).join(' · ');
}

// ticker chip: the eye's anchor for every coin symbol
const tk = c => c ? `<span class="tk">${esc(c)}</span>` : '';
const sideBadge = s => s === 'long' ? '<span class="badge b-long">LONG</span>'
                     : s === 'short' ? '<span class="badge b-short">SHORT</span>' : '';
const verdictBadge = v => v === 'LONG' ? '<span class="badge b-long">LONG</span>'
                        : v === 'SHORT' ? '<span class="badge b-short">SHORT</span>'
                        : v === 'CLOSE' ? '<span class="badge b-fail">CLOSE</span>'
                        : `<span class="badge b-pass">${esc(v || '?')}</span>`;

function head(e, label, cls, bits) {
  return `<div class="ev-head"><span class="ev-ts mono">${fmtTs(e.ts)}</span>` +
         `<span class="ev-type t-${cls}">${label}</span>` + bits.join(' ') + '</div>';
}

// ── TIER 1: full cards, always ───────────────────────────────────────────────
const CARD = {
  research(e) {
    const conf = e.confidence != null ? `<span class="ev-sub mono" style="margin-top:0">conf ${Number(e.confidence).toFixed(2)}</span>` : '';
    const prov = e.provider ? `<span class="chip">${esc(e.provider)}</span>` : '';
    const search = e.web_search_used ? '<span class="chip chip-amber">web search</span>' : '';
    const risk = e.news_risk && e.news_risk !== 'none' ? `<span class="chip chip-red">news risk: ${esc(e.news_risk)}</span>` : '';
    const triad = (e.entry_px || e.stop_px || e.tp_px)
      ? `<div class="ev-sub mono">entry ${fmtNum(e.entry_px)} · stop ${fmtNum(e.stop_px)} · tp ${fmtNum(e.tp_px)}</div>` : '';
    const cites = (e.citations || []).map(c => {
      const url = typeof c === 'string' ? c : (c.url || c.link || '');
      const title = typeof c === 'object' && c.title ? c.title : url;
      return url ? `<div class="ev-sub">· <a class="cite" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a></div>` : '';
    }).join('');
    return head(e, 'research', 'research',
        [tk(e.coin), verdictBadge(e.verdict), conf, prov, search, risk])
      + (e.reasoning ? `<div class="ev-body">${esc(e.reasoning)}</div>` : '')
      + triad + cites;
  },
  execute(e) {
    const status = e.executed ? '<span class="badge b-ok">FILLED</span>' : '<span class="badge b-fail">BLOCKED</span>';
    const book = e.book ? `<span class="chip">${esc(e.book)}</span>` : '';
    const via = e.entry_via ? `<span class="ev-sub" style="margin-top:0">via ${esc(e.entry_via)}</span>` : '';
    let body = '';
    if (e.executed) {
      const parts = [];
      if (e.size_usd != null) parts.push(`size $${Number(e.size_usd).toFixed(2)}`);
      if (e.entry_px != null) parts.push(`entry ${fmtNum(e.entry_px)}`);
      if (e.stop_px != null) parts.push(`stop ${fmtNum(e.stop_px)}`);
      if (e.tp_px != null) parts.push(`tp ${fmtNum(e.tp_px)}`);
      if (e.regime) parts.push(`regime ${esc(e.regime)}`);
      body = `<div class="ev-body mono">${parts.join(' · ')}</div>`;
    }
    const gates = (e.gates || []).map(g => `<span class="chip chip-red">${esc(g)}</span>`).join('');
    const detail = (!e.executed && !((e.gates || []).length) && e.detail)
      ? `<span class="chip chip-red">${esc(e.detail)}</span>` : '';
    const gateRow = (gates || detail) ? `<div class="mt-1">${gates}${detail}</div>` : '';
    return head(e, 'execute', 'execute',
        [tk(e.coin), sideBadge(e.side), status, book, via,
         e.ai_verdict ? `<span class="ev-sub" style="margin-top:0">ai: ${esc(e.ai_verdict)}</span>` : ''])
      + body + gateRow;
  },
  close(e) {
    const pnl = e.pnl_pct != null
      ? `<span class="pnl mono ${e.pnl_pct >= 0 ? 'pos' : 'neg'}">${fmtPct(e.pnl_pct)}</span>` : '';
    const lev = e.leverage ? `<span class="ev-sub mono" style="margin-top:0">${e.leverage}x</span>` : '';
    const src = e.source === 'ai_close' ? '<span class="chip chip-amber">ai close</span>' : '<span class="chip">dsl</span>';
    const failed = e.executed === false ? '<span class="badge b-fail">FAILED</span>' : '';
    const fills = (e.fill_px != null || e.entry_px != null)
      ? `<div class="ev-sub mono">entry ${fmtNum(e.entry_px)} → fill ${fmtNum(e.fill_px)}${e.spot_pct != null ? ` · spot ${fmtPct(e.spot_pct)}` : ''}</div>` : '';
    return head(e, 'close', 'close', [tk(e.coin), sideBadge(e.side), lev, pnl, src, failed])
      + (e.reason ? `<div class="ev-body">${esc(e.reason)}</div>` : '')
      + fills;
  },
  book(e) {   // only book_open reaches tier 1
    return head(e, 'book', 'book',
        [`<b>${esc(e.book)}</b>`, '<span class="badge b-ok">OPENED</span>', tk(e.coin), sideBadge(e.side)]);
  },
  error(e) {
    return head(e, 'error', 'error', [`<b>${esc(e.scope || 'loop')}</b>`])
      + `<div class="ev-body" style="color:#fca5a5">${esc(e.error)}</div>`;
  },
};

// ── TIER 2: compact one-liners ───────────────────────────────────────────────
function lineNode(e) {
  const div = document.createElement('div');
  let cls = 'ev-line', html = '';
  const t = `<span class="ev-ts mono">${fmtTime(e.ts)}</span>`;
  if (e.type === 'research') {   // PASS verdicts: coin, conf, one-line reason
    cls += ' l-research';
    const reason = String(e.reasoning || '').slice(0, 160);
    html = `${t} ${tk(e.coin)} <span class="badge b-pass">PASS</span> <span class="conf mono">conf ${Number(e.confidence ?? 0).toFixed(2)}</span>${reason ? ' — ' + esc(reason) : ''}`;
  } else if (e.type === 'book') {   // cycles that produced signals
    cls += ' l-book';
    const bits = [`<b>${esc(e.book)}</b>`];
    if (e.shadow != null) bits.push(e.shadow ? '<span class="badge b-shadow">SHADOW</span>' : '<span class="badge b-live">LIVE</span>');
    if (e.signals != null) bits.push(`<span class="mono">${e.signals}</span> signal${e.signals === 1 ? '' : 's'}`);
    if (e.opened) bits.push(`<b class="mono">${e.opened} opened</b>`);
    const cands = (e.candidates || []).slice(0, 3).map(c =>
      c && c.coin ? `${tk(c.coin)} ${esc(c.side || '')}`.trim() : esc(readable(c))).join(' ');
    if (cands) bits.push(cands);
    else if (e.signals == null && e.extra) bits.push(esc(readable(e.extra).slice(0, 140)));
    html = `${t} ${bits.join(' · ')}`;
  } else if (e.type === 'system') {
    const f = e.fields || {};
    if (e.name === 'loop_start') {
      html = `${t} ⟳ loop restarted${f.mode ? ' · ' + esc(f.mode) : ''}${f.scan_interval ? ' · scan ' + esc(f.scan_interval) + 's' : ''}${f.min_score ? ' · min score ' + esc(f.min_score) : ''}`;
    } else if (e.name === 'loop_stop') {
      html = `${t} ■ loop stopped`;
    } else {
      html = `${t} <b>${esc(e.name)}</b> ${esc(readable(f).slice(0, 160))}`;
    }
  } else {   // other / unknown shapes → one readable line, never raw JSON
    html = `${t} <b>${esc(e.name || e.type)}</b> ${esc(readable(e.fields || {}).slice(0, 200))}`;
  }
  div.className = cls;
  div.innerHTML = html;
  return div;
}

// ── TIER 3: coalesced rows — one DOM row per group key, merges bump counters
// and float the row to the top so the tape orders by "latest happening". ─────
const coalIndex = new Map();   // gkey -> element

function coalLabel(kind, st) {
  if (kind === 'gate')
    return `${tk(st.coin)} blocked <span class="cnt mono">×${st.n}</span> · ${esc(st.reason || 'gate skip')} · <span class="mono">${fmtHM(st.t0)}→${fmtHM(st.t1)}</span>`;
  if (kind === 'quiet')
    return `<b>${esc(st.book)}</b> · <span class="cnt mono">${st.n}</span> quiet cycle${st.n === 1 ? '' : 's'} · <span class="mono">${fmtHM(st.t0)}→${fmtHM(st.t1)}</span>`;
  if (kind === 'scan') {
    const h = st.hour * 3600000;
    return `<span class="dv mono">${fmtHM(h)}–${fmtHM(h + 3600000)} · ${st.n} scans · ${st.triggers} candidates · ${st.researched} researched · ${st.trades} trades</span>`;
  }
  if (kind === 'steady')
    return `<span class="dv mono">steady · $${Number(st.equity ?? 0).toFixed(2)} · ${st.open ?? 0} open · ${fmtDur(st.t1 - st.t0)}</span>`;
  return `${st.n} events`;
}
function coalState(el) { return JSON.parse(el.dataset.st); }
function coalRender(el) {
  const st = coalState(el);
  el.innerHTML = coalLabel(el.dataset.kind, st);
  el.title = `${st.n} events between ${fmtTs(st.t0)} and ${fmtTs(st.t1)}`;
}
function coalNode(kind, gkey, st) {
  const el = document.createElement('div');
  el.className = (kind === 'steady' || kind === 'scan') ? 'ev-div' : 'ev-coal';
  el.dataset.kind = kind;
  el.dataset.gkey = gkey;
  el.dataset.st = JSON.stringify(st);
  coalRender(el);
  coalIndex.set(gkey, el);
  return el;
}
function coalMerge(el, patch, animate) {
  const st = coalState(el);
  st.n += 1;
  st.t1 = Math.max(st.t1, patch.t1 || 0);
  st.t0 = Math.min(st.t0, patch.t0 || st.t0);
  if (patch.triggers) st.triggers = (st.triggers || 0) + patch.triggers;
  if (patch.equity !== undefined) st.equity = patch.equity;
  if (patch.open !== undefined) st.open = patch.open;
  el.dataset.st = JSON.stringify(st);
  coalRender(el);
  if (feed.firstElementChild !== el) feed.prepend(el);   // active groups float up
  if (animate) { el.classList.remove('coal-tick'); void el.offsetWidth; el.classList.add('coal-tick'); }
}
// research/executed counts fold into the matching hour's scan divider
function bumpHourStats(e, field) {
  const el = coalIndex.get('scan|' + Math.floor((e.ts || 0) / 3600000));
  if (!el) return;
  const st = coalState(el);
  st[field] = (st[field] || 0) + 1;
  el.dataset.st = JSON.stringify(st);
  coalRender(el);
}

// ── heartbeat state machine: line only when equity moves >$0.05 or the open
// count changes; unchanged runs collapse into ONE "steady" divider. ──────────
let lastHB = null;
let steadyRun = 0;
function routeHeartbeat(e) {
  const eq = Number(e.equity ?? 0), open = Number(e.open_positions ?? 0);
  const changed = !lastHB || Math.abs(eq - lastHB.equity) > 0.05 || open !== lastHB.open;
  lastHB = { equity: eq, open };
  if (changed) {
    steadyRun++;
    const div = document.createElement('div');
    div.className = 'ev-line';
    div.innerHTML = `<span class="ev-ts mono">${fmtTime(e.ts)}</span> ♥ equity <b class="mono">$${eq.toFixed(2)}</b> · daily <span class="mono">$${Number(e.daily_pnl ?? 0).toFixed(2)}</span> · ${open} open`;
    return { node: div };
  }
  return { gkey: `hbsteady|${steadyRun}`, kind: 'steady',
           st: { n: 1, t0: e.ts, t1: e.ts, equity: eq, open } };
}

// ── stream state ─────────────────────────────────────────────────────────────
const feed = document.getElementById('feed');
const seen = new Set();
const seenOrder = [];
let newestTs = 0;
let curType = '', curBook = '';
let t12Count = 0;         // tier-1/2 rows rendered (drives empty-tape mode)

const keyOf = e => `${e.ts}|${e.type}|${e.coin || e.book || e.name || ''}|${String(e.reason || e.verdict || e.error || '').slice(0, 24)}`;
function remember(e) {
  const k = keyOf(e);
  if (seen.has(k)) return false;
  seen.add(k); seenOrder.push(k);
  while (seenOrder.length > 2500) seen.delete(seenOrder.shift());
  if ((e.ts || 0) > newestTs) newestTs = e.ts;
  return true;
}

// arrival emphasis + semantic accent: green fills, red errors/losses, indigo verdicts
function emphasisClass(e) {
  if (e.type === 'execute') return e.executed ? 'flash-green' : 'flash-red';
  if (e.type === 'close') return (e.pnl_pct ?? 0) >= 0 ? 'flash-green' : 'flash-red';
  if (e.type === 'error') return 'flash-red';
  if (e.type === 'research') return 'flash-indigo';   // only LONG/SHORT/CLOSE reach tier 1
  if (e.type === 'book') return 'flash-green';        // book_open
  return 'ev-enter';
}
function accentClass(e) {
  if (e.type === 'execute') return e.executed ? 'acc-green' : 'acc-red';
  if (e.type === 'close') return (e.pnl_pct ?? 0) >= 0 ? 'acc-green' : 'acc-red';
  if (e.type === 'error') return 'acc-red';
  if (e.type === 'research') return 'acc-indigo';
  if (e.type === 'book') return 'acc-teal';           // book_open
  return '';
}

function cardNode(e) {
  const div = document.createElement('div');
  div.className = `ev k-${e.type} ${accentClass(e)}`;
  div.innerHTML = (CARD[e.type] || CARD.error)(e);
  return div;
}

function clearEmptyTape() {
  const b = feed.querySelector('.empty-tape');
  if (b) b.remove();
}

// One event, chronological order in → one journal mutation at the top.
function ingest(e, animate) {
  if (!remember(e)) return;
  if (e.type === 'research') bumpHourStats(e, 'researched');
  if (e.type === 'execute' && e.executed) bumpHourStats(e, 'trades');

  if (e.tier === 3) {
    let gkey = e.gkey, kind, st;
    if (e.type === 'heartbeat') {
      const r = routeHeartbeat(e);
      if (r.node) {                 // changed heartbeat → compact line
        if (animate) r.node.classList.add('ev-enter');
        feed.prepend(r.node);
        trim();
        return;
      }
      gkey = r.gkey; kind = r.kind; st = r.st;
    } else if (e.type === 'gate') {
      kind = 'gate';
      st = { n: 1, t0: e.ts, t1: e.ts, coin: e.coin, reason: e.reason };
    } else if (e.type === 'scan') {
      kind = 'scan';
      st = { n: 1, t0: e.ts, t1: e.ts, hour: Math.floor((e.ts || 0) / 3600000),
             triggers: Number(e.triggers || 0), researched: 0, trades: 0 };
    } else {                        // quiet book cycle
      kind = 'quiet';
      st = { n: 1, t0: e.ts, t1: e.ts, book: e.book };
    }
    const existing = coalIndex.get(gkey);
    if (existing) {
      coalMerge(existing, { t0: e.ts, t1: e.ts, triggers: st.triggers,
                            equity: st.equity, open: st.open }, animate);
    } else {
      const node = coalNode(kind, gkey, st);
      if (animate) node.classList.add('ev-enter');
      feed.prepend(node);
    }
    trim();
    return;
  }

  clearEmptyTape();
  t12Count++;
  const node = e.tier === 1 ? cardNode(e) : lineNode(e);
  if (animate) node.classList.add(e.tier === 1 ? emphasisClass(e) : 'ev-enter');
  feed.prepend(node);
  trim();
}

function trim() {
  while (feed.children.length > 300) {
    const last = feed.lastElementChild;
    if (last.dataset && last.dataset.gkey) coalIndex.delete(last.dataset.gkey);
    last.remove();
  }
}

// ── empty-tape mode ──────────────────────────────────────────────────────────
function maybeEmptyTape(session) {
  if (t12Count > 0 || feed.querySelector('.empty-tape')) return;
  const b = document.createElement('div');
  b.className = 'empty-tape';
  const since = session && session.since_ts ? fmtHM(session.since_ts) : '—';
  const scans = session ? session.scans : 0;
  const blocks = session ? session.blocks : 0;
  b.textContent = `nothing actionable since ${since} — engine scanning normally (${scans} scans, ${blocks} blocks)`;
  feed.prepend(b);
}

// ── session strip: KPI chips, money colored by sign ─────────────────────────
function kpiChip(label, value, cls) {
  return `<div class="kpi"><span class="v${cls ? ' ' + cls : ''}">${value}</span><span class="l">${label}</span></div>`;
}
function renderStrip(s) {
  if (!s) return;
  const el = document.getElementById('session-strip');
  const pnl = s.realized_pnl_pct ?? 0;
  const pnlCls = pnl > 0 ? 'pos' : pnl < 0 ? 'neg' : '';
  el.innerHTML =
    kpiChip('scans', s.scans) +
    kpiChip('candidates', s.candidates) +
    kpiChip('researched', s.researched) +
    kpiChip('opened', s.opened) +
    kpiChip('closed', s.closed) +
    kpiChip('realized', fmtPct(pnl), pnlCls) +
    kpiChip('equity', s.equity != null ? '$' + Number(s.equity).toFixed(2) : '—') +
    kpiChip('open', s.open_positions != null ? s.open_positions : '—');
}

// ── load + poll ──────────────────────────────────────────────────────────────
function setMeta() {
  document.getElementById('feed-meta').textContent =
    `journal · newest first · updated ${fmtTime(Date.now())}`;
}

async function fullLoad() {
  const qs = new URLSearchParams({ limit: 300 });
  if (curType) qs.set('type', curType);
  if (curBook) qs.set('book', curBook);
  const data = await (await fetch('/api/dashboard/activity?' + qs)).json();
  buildFilters(data);
  renderStrip(data.session);
  feed.innerHTML = '';
  coalIndex.clear(); seen.clear(); seenOrder.length = 0;
  newestTs = 0; lastHB = null; steadyRun = 0; t12Count = 0;
  const chrono = (data.events || []).slice().reverse();   // oldest → newest
  for (const e of chrono) ingest(e, false);
  maybeEmptyTape(data.session);
  setMeta();
}

async function pollNew() {
  if (!newestTs) return fullLoad().catch(() => {});
  const qs = new URLSearchParams({ limit: 100, since: String(newestTs - 1) });
  if (curType) qs.set('type', curType);
  if (curBook) qs.set('book', curBook);
  try {
    const data = await (await fetch('/api/dashboard/activity?' + qs)).json();
    renderStrip(data.session);
    const chrono = (data.events || []).slice().reverse();
    for (const e of chrono) ingest(e, true);
    setMeta();
  } catch (e) {}
}

function buildFilters(data) {
  const wrap = document.getElementById('type-filters');
  if (wrap.childElementCount) return;
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.className = 'fchip' + (val === curType ? ' on' : '');
    b.textContent = label;
    b.dataset.type = val;
    b.addEventListener('click', () => {
      curType = val;
      wrap.querySelectorAll('.fchip').forEach(x => x.classList.toggle('on', x.dataset.type === val));
      fullLoad().catch(() => {});
    });
    wrap.appendChild(b);
  };
  mk('all', '');
  for (const t of (data.types || [])) mk(t, t);
  const sel = document.getElementById('book-filter');
  for (const b of (data.books || [])) {
    const o = document.createElement('option');
    o.value = b; o.textContent = b;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => { curBook = sel.value; fullLoad().catch(() => {}); });
}

(function () {
  const here = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('a[data-nav]').forEach(a => {
    if (a.dataset.nav === here) a.classList.add('nav-active');
  });
})();

fullLoad().catch(() => {
  feed.innerHTML = '<div class="ev-coal">feed load failed — is the server up?</div>';
});
setInterval(pollNew, 8000);
</script>
</body>
</html>
