<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hermes-trader · activity</title>
<script src="/static/tailwind.js"></script>
<style>
  body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0a0a0a;color:#e5e5e5}
  .num{font-variant-numeric:tabular-nums}
  .lcd{background:#052e1c;border:2px solid #34d399;box-shadow:inset 0 0 0 1px #022c1e,4px 4px 0 #064e3b;padding:8px 12px;color:#6ee7b7;font-weight:700;letter-spacing:.08em}
  .nav-link{display:inline-block;padding:7px 12px;font-size:11px;letter-spacing:.12em;color:#a3a3a3;background:#18181b;border:2px solid #3f3f46;box-shadow:2px 2px 0 #0a0a0a;text-decoration:none;font-weight:700}
  .nav-link:hover{color:#a7f3d0;border-color:#047857;box-shadow:2px 2px 0 #022c1e}
  .nav-link.nav-active{background:#064e3b;color:#6ee7b7;border-color:#34d399;box-shadow:2px 2px 0 #022c1e}
  .badge{display:inline-block;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:.08em;border:1px solid currentColor;white-space:nowrap}
  .b-live{color:#6ee7b7;background:#064e3b}
  .b-shadow{color:#fbbf24;background:#451a03}
  .b-long{color:#6ee7b7;background:#064e3b}
  .b-short{color:#fca5a5;background:#450a0a}
  .b-pass{color:#a1a1aa;background:#27272a}
  .b-ok{color:#6ee7b7;background:#064e3b}
  .b-fail{color:#fca5a5;background:#450a0a}
  .chip{display:inline-block;padding:2px 8px;font-size:10px;border:1px solid #3f3f46;background:#18181b;color:#a3a3a3;margin:2px 4px 2px 0;white-space:nowrap}
  .chip.chip-red{border-color:#7f1d1d;color:#fca5a5;background:#1f0808}
  .chip.chip-amber{border-color:#78350f;color:#fbbf24;background:#1f1300}
  /* ── session strip: the "what's happening" answer, pinned ── */
  .strip{position:sticky;top:0;z-index:20;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;
         background:#0c0d0e;border:2px solid #1f2937;border-left:2px solid #34d399;
         padding:8px 14px;margin-bottom:14px;font-size:11px;color:#a3a3a3;box-shadow:0 6px 12px rgba(0,0,0,.6)}
  .strip .s-label{color:#52525b;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .strip b{color:#e5e5e5;font-weight:700}
  .strip .pos{color:#34d399}.strip .neg{color:#f87171}
  /* ── the journal: T1 cards, T2 lines, T3 coalesced rows ── */
  #feed{border-left:2px solid #1f2937;padding-left:14px}
  .ev{border:1px solid #1f2937;background:#0c0d0e;padding:8px 12px;margin-bottom:8px;position:relative}
  .ev::before{content:'';position:absolute;left:-19px;top:14px;width:8px;height:8px;background:#3f3f46;border:1px solid #0a0a0a}
  .ev.k-research::before{background:#a5b4fc}
  .ev.k-execute::before{background:#86efac}
  .ev.k-close::before{background:#fbbf24}
  .ev.k-book::before{background:#5eead4}
  .ev.k-error::before{background:#f87171}
  .ev-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .ev-ts{color:#52525b;font-size:10px;white-space:nowrap}
  .ev-type{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .ev-type.t-research{color:#a5b4fc}.ev-type.t-execute{color:#86efac}.ev-type.t-close{color:#fbbf24}
  .ev-type.t-book{color:#5eead4}.ev-type.t-error{color:#f87171}
  .ev-body{font-size:12px;color:#d4d4d8;margin-top:3px;line-height:1.55;word-break:break-word}
  .ev-sub{font-size:11px;color:#71717a;margin-top:2px}
  /* T2: compact one-liners */
  .ev-line{font-size:11px;color:#a3a3a3;padding:3px 12px;margin-bottom:4px;border-left:2px solid #3f3f46;line-height:1.5;word-break:break-word}
  .ev-line b{color:#d4d4d8;font-weight:600}
  .ev-line.l-research{border-left-color:#4c4f8f}
  .ev-line.l-book{border-left-color:#134e4a}
  .ev-line.l-system{border-left-color:#3f3f46;color:#71717a}
  .ev-line .conf{color:#71717a}
  /* T3: coalesced rows + dividers */
  .ev-coal{font-size:11px;color:#71717a;padding:3px 12px;margin-bottom:4px;border-left:2px solid #27272a;line-height:1.5}
  .ev-coal b{color:#a3a3a3;font-weight:600}
  .ev-coal .cnt{color:#fbbf24;font-weight:700}
  .ev-div{font-size:10px;color:#52525b;text-align:center;padding:3px 0;margin-bottom:4px;letter-spacing:.06em}
  .ev-div .cnt{color:#71717a;font-weight:700}
  .empty-tape{font-size:12px;color:#71717a;padding:14px;border:1px dashed #27272a;margin-bottom:10px;line-height:1.7}
  /* ── arrival animations — CSS only, reduced-motion respected ── */
  .ev-enter{animation:ev-in .5s cubic-bezier(.2,.7,.3,1)}
  @keyframes ev-in{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:none}}
  .flash-green{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-g 1.8s ease-out}
  @keyframes glow-g{0%{border-color:#34d399;box-shadow:0 0 16px rgba(52,211,153,.45);background:#052e1c}100%{border-color:#1f2937;box-shadow:none;background:#0c0d0e}}
  .flash-red{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-r 1.8s ease-out}
  @keyframes glow-r{0%{border-color:#f87171;box-shadow:0 0 16px rgba(248,113,113,.4);background:#2b0a0a}100%{border-color:#1f2937;box-shadow:none;background:#0c0d0e}}
  .flash-indigo{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-i 1.5s ease-out}
  @keyframes glow-i{0%{border-color:#818cf8;box-shadow:0 0 12px rgba(129,140,248,.35);background:#14142b}100%{border-color:#1f2937;box-shadow:none;background:#0c0d0e}}
  .coal-tick{animation:coal-tick .6s ease-out}
  @keyframes coal-tick{0%{color:#a7f3d0;border-left-color:#047857}100%{color:#71717a;border-left-color:#27272a}}
  @media (prefers-reduced-motion: reduce){
    .ev-enter,.flash-green,.flash-red,.flash-indigo,.coal-tick{animation:none}
  }
  /* light filter chips */
  .fchip{padding:3px 10px;font-size:10px;letter-spacing:.06em;background:transparent;border:1px solid #3f3f46;color:#71717a;cursor:pointer}
  .fchip:hover{border-color:#047857;color:#a7f3d0}
  .fchip.on{background:#064e3b;border-color:#34d399;color:#6ee7b7}
  select.fsel{background:#18181b;border:1px solid #3f3f46;color:#d4d4d8;font-size:11px;padding:3px 8px}
  a.cite{color:#7dd3fc;text-decoration:underline;word-break:break-all}
</style>
</head>
<body class="min-h-screen">
<div class="max-w-[1000px] mx-auto px-6 py-6">

  <header class="flex items-center justify-between mb-4 gap-3 flex-wrap">
    <span class="lcd text-sm">HERMES-TRADER · ACTIVITY</span>
    <span class="text-[10px] text-zinc-500" id="feed-meta"></span>
  </header>

  <nav class="flex items-center gap-2 mb-5 flex-wrap">
    <a href="/" data-nav="/" class="nav-link">DASHBOARD</a>
    <a href="/activity" data-nav="/activity" class="nav-link">ACTIVITY</a>
    <a href="/news" data-nav="/news" class="nav-link">NEWS</a>
  </nav>

  <div class="strip" id="session-strip">
    <span class="s-label">last 6h</span><span>loading&hellip;</span>
  </div>

  <div class="flex items-center gap-2 flex-wrap mb-5" id="filter-bar">
    <span id="type-filters" class="flex items-center gap-1.5 flex-wrap"></span>
    <select id="book-filter" class="fsel"><option value="">all books</option></select>
  </div>

  <div id="feed"><div class="ev-coal">loading&hellip;</div></div>

  <footer class="text-[10px] text-zinc-600 mt-6 text-center">
    one wallet · live · not financial advice
  </footer>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = ms => { const d = new Date(ms || Date.now()); return d.toTimeString().slice(0, 8); };
const fmtHM = ms => { const d = new Date(ms || Date.now()); return d.toTimeString().slice(0, 5); };
const fmtDay = ms => { const d = new Date(ms || Date.now()); return (d.getMonth() + 1) + '/' + d.getDate(); };
const fmtTs = ms => fmtDay(ms) + ' ' + fmtTime(ms);
const fmtDur = ms => {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
};
const fmtNum = v => {
  if (v == null || typeof v !== 'number' || !isFinite(v)) return String(v);
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return (v / 1e3).toFixed(1) + 'k';
  if (a >= 100) return v.toFixed(2);
  if (a >= 1) return v.toFixed(3);
  return v.toFixed(5);
};
const fmtPct = n => (n >= 0 ? '+' : '') + Number(n ?? 0).toFixed(2) + '%';

// Readable scalar for any value — no raw JSON, ever.
function readable(v, depth) {
  depth = depth || 0;
  if (v == null) return '—';
  if (typeof v === 'number') return fmtNum(v);
  if (typeof v !== 'object') return String(v);
  if (depth >= 2) return '…';
  if (Array.isArray(v)) {
    if (!v.length) return 'none';
    return v.map(x => readable(x, depth + 1)).join(', ');
  }
  return Object.entries(v).map(([k, x]) => `${k}: ${readable(x, depth + 1)}`).join(' · ');
}

const sideBadge = s => s === 'long' ? '<span class="badge b-long">LONG</span>'
                     : s === 'short' ? '<span class="badge b-short">SHORT</span>' : '';
const verdictBadge = v => v === 'LONG' ? '<span class="badge b-long">LONG</span>'
                        : v === 'SHORT' ? '<span class="badge b-short">SHORT</span>'
                        : v === 'CLOSE' ? '<span class="badge b-fail">CLOSE</span>'
                        : `<span class="badge b-pass">${esc(v || '?')}</span>`;

function head(e, label, cls, bits) {
  return `<div class="ev-head"><span class="ev-ts num">${fmtTs(e.ts)}</span>` +
         `<span class="ev-type t-${cls}">${label}</span>` + bits.join(' ') + '</div>';
}

// ── TIER 1: full cards, always ───────────────────────────────────────────────
const CARD = {
  research(e) {
    const conf = e.confidence != null ? `<span class="text-zinc-500 text-[11px] num">conf ${Number(e.confidence).toFixed(2)}</span>` : '';
    const prov = e.provider ? `<span class="chip">${esc(e.provider)}</span>` : '';
    const search = e.web_search_used ? '<span class="chip chip-amber">web search</span>' : '';
    const risk = e.news_risk && e.news_risk !== 'none' ? `<span class="chip chip-red">news risk: ${esc(e.news_risk)}</span>` : '';
    const triad = (e.entry_px || e.stop_px || e.tp_px)
      ? `<div class="ev-sub num">entry ${fmtNum(e.entry_px)} · stop ${fmtNum(e.stop_px)} · tp ${fmtNum(e.tp_px)}</div>` : '';
    const cites = (e.citations || []).map(c => {
      const url = typeof c === 'string' ? c : (c.url || c.link || '');
      const title = typeof c === 'object' && c.title ? c.title : url;
      return url ? `<div class="ev-sub">· <a class="cite" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a></div>` : '';
    }).join('');
    return head(e, 'research', 'research',
        [`<b>${esc(e.coin)}</b>`, verdictBadge(e.verdict), conf, prov, search, risk])
      + (e.reasoning ? `<div class="ev-body">${esc(e.reasoning)}</div>` : '')
      + triad + cites;
  },
  execute(e) {
    const status = e.executed ? '<span class="badge b-ok">FILLED</span>' : '<span class="badge b-fail">BLOCKED</span>';
    const book = e.book ? `<span class="chip">${esc(e.book)}</span>` : '';
    const via = e.entry_via ? `<span class="text-zinc-500 text-[11px]">via ${esc(e.entry_via)}</span>` : '';
    let body = '';
    if (e.executed) {
      const parts = [];
      if (e.size_usd != null) parts.push(`size $${Number(e.size_usd).toFixed(2)}`);
      if (e.entry_px != null) parts.push(`entry ${fmtNum(e.entry_px)}`);
      if (e.stop_px != null) parts.push(`stop ${fmtNum(e.stop_px)}`);
      if (e.tp_px != null) parts.push(`tp ${fmtNum(e.tp_px)}`);
      if (e.regime) parts.push(`regime ${esc(e.regime)}`);
      body = `<div class="ev-body num">${parts.join(' · ')}</div>`;
    }
    const gates = (e.gates || []).map(g => `<span class="chip chip-red">${esc(g)}</span>`).join('');
    const detail = (!e.executed && !((e.gates || []).length) && e.detail)
      ? `<span class="chip chip-red">${esc(e.detail)}</span>` : '';
    const gateRow = (gates || detail) ? `<div class="mt-1">${gates}${detail}</div>` : '';
    return head(e, 'execute', 'execute',
        [`<b>${esc(e.coin)}</b>`, sideBadge(e.side), status, book, via,
         e.ai_verdict ? `<span class="text-zinc-600 text-[11px]">ai: ${esc(e.ai_verdict)}</span>` : ''])
      + body + gateRow;
  },
  close(e) {
    const pnl = e.pnl_pct != null
      ? `<span class="num font-bold ${e.pnl_pct >= 0 ? 'text-emerald-400' : 'text-red-400'}">${fmtPct(e.pnl_pct)}</span>` : '';
    const lev = e.leverage ? `<span class="text-zinc-500 text-[11px]">${e.leverage}x</span>` : '';
    const src = e.source === 'ai_close' ? '<span class="chip chip-amber">ai close</span>' : '<span class="chip">dsl</span>';
    const failed = e.executed === false ? '<span class="badge b-fail">FAILED</span>' : '';
    const fills = (e.fill_px != null || e.entry_px != null)
      ? `<div class="ev-sub num">entry ${fmtNum(e.entry_px)} → fill ${fmtNum(e.fill_px)}${e.spot_pct != null ? ` · spot ${fmtPct(e.spot_pct)}` : ''}</div>` : '';
    return head(e, 'close', 'close', [`<b>${esc(e.coin)}</b>`, sideBadge(e.side), lev, pnl, src, failed])
      + (e.reason ? `<div class="ev-body">${esc(e.reason)}</div>` : '')
      + fills;
  },
  book(e) {   // only book_open reaches tier 1
    return head(e, 'book', 'book',
        [`<b>${esc(e.book)}</b>`, '<span class="badge b-ok">OPENED</span>', `<b>${esc(e.coin)}</b>`, sideBadge(e.side)]);
  },
  error(e) {
    return head(e, 'error', 'error', [`<b>${esc(e.scope || 'loop')}</b>`])
      + `<div class="ev-body text-red-300">${esc(e.error)}</div>`;
  },
};

// ── TIER 2: compact one-liners ───────────────────────────────────────────────
function lineNode(e) {
  const div = document.createElement('div');
  let cls = 'ev-line', html = '';
  const t = `<span class="ev-ts num">${fmtTime(e.ts)}</span>`;
  if (e.type === 'research') {   // PASS verdicts: coin, conf, one-line reason
    cls += ' l-research';
    const reason = String(e.reasoning || '').slice(0, 160);
    html = `${t} <b>${esc(e.coin)}</b> PASS <span class="conf num">conf ${Number(e.confidence ?? 0).toFixed(2)}</span>${reason ? ' — ' + esc(reason) : ''}`;
  } else if (e.type === 'book') {   // cycles that produced signals
    cls += ' l-book';
    const bits = [`<b>${esc(e.book)}</b>`];
    if (e.shadow != null) bits.push(e.shadow ? 'shadow' : 'live');
    if (e.signals != null) bits.push(`${e.signals} signal${e.signals === 1 ? '' : 's'}`);
    if (e.opened) bits.push(`<b>${e.opened} opened</b>`);
    const cands = (e.candidates || []).slice(0, 3).map(c =>
      c && c.coin ? `${c.coin} ${c.side || ''}`.trim() : readable(c)).join(', ');
    if (cands) bits.push(esc(cands));
    else if (e.signals == null && e.extra) bits.push(esc(readable(e.extra).slice(0, 140)));
    html = `${t} ${bits.join(' · ')}`;
  } else if (e.type === 'system') {
    cls += ' l-system';
    const f = e.fields || {};
    if (e.name === 'loop_start') {
      html = `${t} ⟳ loop restarted${f.mode ? ' · ' + esc(f.mode) : ''}${f.scan_interval ? ' · scan ' + esc(f.scan_interval) + 's' : ''}${f.min_score ? ' · min score ' + esc(f.min_score) : ''}`;
    } else if (e.name === 'loop_stop') {
      html = `${t} ■ loop stopped`;
    } else {
      html = `${t} <b>${esc(e.name)}</b> ${esc(readable(f).slice(0, 160))}`;
    }
  } else {   // other / unknown shapes → one readable line, never raw JSON
    cls += ' l-system';
    html = `${t} <b>${esc(e.name || e.type)}</b> ${esc(readable(e.fields || {}).slice(0, 200))}`;
  }
  div.className = cls;
  div.innerHTML = html;
  return div;
}

// ── TIER 3: coalesced rows — one DOM row per group key, merges bump counters
// and float the row to the top so the tape orders by "latest happening". ─────
const coalIndex = new Map();   // gkey -> element

function coalLabel(kind, st) {
  if (kind === 'gate')
    return `<b>${esc(st.coin ?? '?')}</b> blocked <span class="cnt">×${st.n}</span> · ${esc(st.reason || 'gate skip')} · ${fmtHM(st.t0)}→${fmtHM(st.t1)}`;
  if (kind === 'quiet')
    return `<b>${esc(st.book)}</b> · <span class="cnt">${st.n}</span> quiet cycle${st.n === 1 ? '' : 's'} · ${fmtHM(st.t0)}→${fmtHM(st.t1)}`;
  if (kind === 'scan') {
    const h = st.hour * 3600000;
    return `${fmtHM(h)}-${fmtHM(h + 3600000)} · <span class="cnt">${st.n}</span> scans · ${st.triggers} candidates · ${st.researched} researched · ${st.trades} trades`;
  }
  if (kind === 'steady')
    return `── steady · $${Number(st.equity ?? 0).toFixed(2)} · ${st.open ?? 0} open · ${fmtDur(st.t1 - st.t0)} ──`;
  return `${st.n} events`;
}
function coalState(el) { return JSON.parse(el.dataset.st); }
function coalRender(el) {
  const st = coalState(el);
  el.innerHTML = coalLabel(el.dataset.kind, st);
  el.title = `${st.n} events between ${fmtTs(st.t0)} and ${fmtTs(st.t1)}`;
}
function coalNode(kind, gkey, st) {
  const el = document.createElement('div');
  el.className = (kind === 'steady' || kind === 'scan') ? 'ev-div num' : 'ev-coal num';
  el.dataset.kind = kind;
  el.dataset.gkey = gkey;
  el.dataset.st = JSON.stringify(st);
  coalRender(el);
  coalIndex.set(gkey, el);
  return el;
}
function coalMerge(el, patch, animate) {
  const st = coalState(el);
  st.n += 1;
  st.t1 = Math.max(st.t1, patch.t1 || 0);
  st.t0 = Math.min(st.t0, patch.t0 || st.t0);
  if (patch.triggers) st.triggers = (st.triggers || 0) + patch.triggers;
  if (patch.equity !== undefined) st.equity = patch.equity;
  if (patch.open !== undefined) st.open = patch.open;
  el.dataset.st = JSON.stringify(st);
  coalRender(el);
  if (feed.firstElementChild !== el) feed.prepend(el);   // active groups float up
  if (animate) { el.classList.remove('coal-tick'); void el.offsetWidth; el.classList.add('coal-tick'); }
}
// research/executed counts fold into the matching hour's scan divider
function bumpHourStats(e, field) {
  const el = coalIndex.get('scan|' + Math.floor((e.ts || 0) / 3600000));
  if (!el) return;
  const st = coalState(el);
  st[field] = (st[field] || 0) + 1;
  el.dataset.st = JSON.stringify(st);
  coalRender(el);
}

// ── heartbeat state machine: line only when equity moves >$0.05 or the open
// count changes; unchanged runs collapse into ONE "steady" divider. ──────────
let lastHB = null;
let steadyRun = 0;
function routeHeartbeat(e) {
  const eq = Number(e.equity ?? 0), open = Number(e.open_positions ?? 0);
  const changed = !lastHB || Math.abs(eq - lastHB.equity) > 0.05 || open !== lastHB.open;
  lastHB = { equity: eq, open };
  if (changed) {
    steadyRun++;
    const div = document.createElement('div');
    div.className = 'ev-line l-system num';
    div.innerHTML = `<span class="ev-ts num">${fmtTime(e.ts)}</span> ♥ equity $${eq.toFixed(2)} · daily $${Number(e.daily_pnl ?? 0).toFixed(2)} · ${open} open`;
    return { node: div };
  }
  return { gkey: `hbsteady|${steadyRun}`, kind: 'steady',
           st: { n: 1, t0: e.ts, t1: e.ts, equity: eq, open } };
}

// ── stream state ─────────────────────────────────────────────────────────────
const feed = document.getElementById('feed');
const seen = new Set();
const seenOrder = [];
let newestTs = 0;
let curType = '', curBook = '';
let t12Count = 0;         // tier-1/2 rows rendered (drives empty-tape mode)

const keyOf = e => `${e.ts}|${e.type}|${e.coin || e.book || e.name || ''}|${String(e.reason || e.verdict || e.error || '').slice(0, 24)}`;
function remember(e) {
  const k = keyOf(e);
  if (seen.has(k)) return false;
  seen.add(k); seenOrder.push(k);
  while (seenOrder.length > 2500) seen.delete(seenOrder.shift());
  if ((e.ts || 0) > newestTs) newestTs = e.ts;
  return true;
}

function emphasisClass(e) {
  if (e.type === 'execute') return e.executed ? 'flash-green' : 'flash-red';
  if (e.type === 'close') return (e.pnl_pct ?? 0) >= 0 ? 'flash-green' : 'flash-red';
  if (e.type === 'error') return 'flash-red';
  if (e.type === 'research') return 'flash-indigo';   // only LONG/SHORT/CLOSE reach tier 1
  if (e.type === 'book') return 'flash-green';        // book_open
  return 'ev-enter';
}

function cardNode(e) {
  const div = document.createElement('div');
  div.className = `ev k-${e.type}`;
  div.innerHTML = (CARD[e.type] || CARD.error)(e);
  return div;
}

function clearEmptyTape() {
  const b = feed.querySelector('.empty-tape');
  if (b) b.remove();
}

// One event, chronological order in → one journal mutation at the top.
function ingest(e, animate) {
  if (!remember(e)) return;
  if (e.type === 'research') bumpHourStats(e, 'researched');
  if (e.type === 'execute' && e.executed) bumpHourStats(e, 'trades');

  if (e.tier === 3) {
    let gkey = e.gkey, kind, st;
    if (e.type === 'heartbeat') {
      const r = routeHeartbeat(e);
      if (r.node) {                 // changed heartbeat → compact line
        if (animate) r.node.classList.add('ev-enter');
        feed.prepend(r.node);
        trim();
        return;
      }
      gkey = r.gkey; kind = r.kind; st = r.st;
    } else if (e.type === 'gate') {
      kind = 'gate';
      st = { n: 1, t0: e.ts, t1: e.ts, coin: e.coin, reason: e.reason };
    } else if (e.type === 'scan') {
      kind = 'scan';
      st = { n: 1, t0: e.ts, t1: e.ts, hour: Math.floor((e.ts || 0) / 3600000),
             triggers: Number(e.triggers || 0), researched: 0, trades: 0 };
    } else {                        // quiet book cycle
      kind = 'quiet';
      st = { n: 1, t0: e.ts, t1: e.ts, book: e.book };
    }
    const existing = coalIndex.get(gkey);
    if (existing) {
      coalMerge(existing, { t0: e.ts, t1: e.ts, triggers: st.triggers,
                            equity: st.equity, open: st.open }, animate);
    } else {
      const node = coalNode(kind, gkey, st);
      if (animate) node.classList.add('ev-enter');
      feed.prepend(node);
    }
    trim();
    return;
  }

  clearEmptyTape();
  t12Count++;
  const node = e.tier === 1 ? cardNode(e) : lineNode(e);
  if (animate) node.classList.add(e.tier === 1 ? emphasisClass(e) : 'ev-enter');
  feed.prepend(node);
  trim();
}

function trim() {
  while (feed.children.length > 300) {
    const last = feed.lastElementChild;
    if (last.dataset && last.dataset.gkey) coalIndex.delete(last.dataset.gkey);
    last.remove();
  }
}

// ── empty-tape mode ──────────────────────────────────────────────────────────
function maybeEmptyTape(session) {
  if (t12Count > 0 || feed.querySelector('.empty-tape')) return;
  const b = document.createElement('div');
  b.className = 'empty-tape';
  const since = session && session.since_ts ? fmtHM(session.since_ts) : '—';
  const scans = session ? session.scans : 0;
  const blocks = session ? session.blocks : 0;
  b.textContent = `nothing actionable since ${since} — engine scanning normally (${scans} scans, ${blocks} blocks)`;
  feed.prepend(b);
}

// ── session strip ────────────────────────────────────────────────────────────
function renderStrip(s) {
  if (!s) return;
  const el = document.getElementById('session-strip');
  const pnlCls = (s.realized_pnl_pct ?? 0) >= 0 ? 'pos' : 'neg';
  el.innerHTML =
    `<span class="s-label">last ${s.window_h}h</span>` +
    `<span class="num">scans <b>${s.scans}</b></span>` +
    `<span class="num">candidates <b>${s.candidates}</b></span>` +
    `<span class="num">researched <b>${s.researched}</b></span>` +
    `<span class="num">opened <b>${s.opened}</b></span>` +
    `<span class="num">closed <b>${s.closed}</b></span>` +
    `<span class="num">realized <b class="${pnlCls}">${fmtPct(s.realized_pnl_pct)}</b></span>` +
    `<span class="num">equity <b>${s.equity != null ? '$' + Number(s.equity).toFixed(2) : '—'}</b>` +
    `${s.open_positions != null ? ' · ' + s.open_positions + ' open' : ''}</span>`;
}

// ── load + poll ──────────────────────────────────────────────────────────────
function setMeta() {
  document.getElementById('feed-meta').textContent =
    `journal · newest first · updated ${fmtTime(Date.now())}`;
}

async function fullLoad() {
  const qs = new URLSearchParams({ limit: 300 });
  if (curType) qs.set('type', curType);
  if (curBook) qs.set('book', curBook);
  const data = await (await fetch('/api/dashboard/activity?' + qs)).json();
  buildFilters(data);
  renderStrip(data.session);
  feed.innerHTML = '';
  coalIndex.clear(); seen.clear(); seenOrder.length = 0;
  newestTs = 0; lastHB = null; steadyRun = 0; t12Count = 0;
  const chrono = (data.events || []).slice().reverse();   // oldest → newest
  for (const e of chrono) ingest(e, false);
  maybeEmptyTape(data.session);
  setMeta();
}

async function pollNew() {
  if (!newestTs) return fullLoad().catch(() => {});
  const qs = new URLSearchParams({ limit: 100, since: String(newestTs - 1) });
  if (curType) qs.set('type', curType);
  if (curBook) qs.set('book', curBook);
  try {
    const data = await (await fetch('/api/dashboard/activity?' + qs)).json();
    renderStrip(data.session);
    const chrono = (data.events || []).slice().reverse();
    for (const e of chrono) ingest(e, true);
    setMeta();
  } catch (e) {}
}

function buildFilters(data) {
  const wrap = document.getElementById('type-filters');
  if (wrap.childElementCount) return;
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.className = 'fchip' + (val === curType ? ' on' : '');
    b.textContent = label;
    b.dataset.type = val;
    b.addEventListener('click', () => {
      curType = val;
      wrap.querySelectorAll('.fchip').forEach(x => x.classList.toggle('on', x.dataset.type === val));
      fullLoad().catch(() => {});
    });
    wrap.appendChild(b);
  };
  mk('all', '');
  for (const t of (data.types || [])) mk(t, t);
  const sel = document.getElementById('book-filter');
  for (const b of (data.books || [])) {
    const o = document.createElement('option');
    o.value = b; o.textContent = b;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => { curBook = sel.value; fullLoad().catch(() => {}); });
}

(function () {
  const here = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('a[data-nav]').forEach(a => {
    if (a.dataset.nav === here) a.classList.add('nav-active');
  });
})();

fullLoad().catch(() => {
  feed.innerHTML = '<div class="ev-coal">feed load failed — is the server up?</div>';
});
setInterval(pollNew, 8000);
</script>
