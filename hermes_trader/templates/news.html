<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hermes-trader · news</title>
<script src="/static/tailwind.js"></script>
<style>
  /* ── same design system as /activity: sans for words, mono for numbers/
     tickers/time; saturated color reserved for direction + BREAKING. ── */
  :root{
    --card:#14161b; --card2:#181b21;
    --line:#23262e; --line2:#2c313c;
    --txt:#e8eaf0; --mut:#9aa1ad; --dim:#5c6370; --faint:#3d434e;
    --up:#22c55e; --dn:#ef4444; --ind:#818cf8; --amb:#f59e0b; --teal:#2dd4bf;
    --vio:#8b5cf6;
    --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a855f7 100%);
  }
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);
    background:#0a0b0d;
    background-image:radial-gradient(1100px 520px at 50% -160px,#16141f 0%,#0e1014 50%,#0a0b0d 100%);
    background-repeat:no-repeat;background-attachment:fixed;
  }
  .mono,.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .brand{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;font-size:15px;letter-spacing:.16em;color:var(--txt)}
  .brand .dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--grad);margin-right:10px;box-shadow:0 0 12px rgba(139,92,246,.65)}
  .brand small{color:var(--dim);font-weight:600;letter-spacing:.18em;font-size:10px}
  .nav-link{display:inline-block;padding:6px 14px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mut);border-radius:8px;text-decoration:none;border:1px solid transparent}
  .nav-link:hover{color:var(--txt);background:var(--card)}
  .nav-link:active{transform:translateY(1px)}
  .nav-link.nav-active{color:var(--txt);background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(168,85,247,.16));border-color:rgba(139,92,246,.45)}
  .tk{display:inline-block;padding:1px 9px;border-radius:999px;background:#1d212b;border:1px solid var(--line2);color:#f4f6fa;font-weight:700;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;white-space:nowrap}
  .badge{display:inline-block;padding:1px 8px;font-size:10px;font-weight:700;letter-spacing:.08em;border-radius:999px;border:1px solid transparent;white-space:nowrap}
  .b-long{color:#86efac;background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.35)}
  .b-short{color:#fca5a5;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35)}
  .b-shadow{color:#fcd34d;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3)}
  .b-pass{color:var(--mut);background:#1d212b;border-color:var(--line2)}
  .b-breaking{color:#fcd34d;background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.45);animation:badge-blink 1.4s ease-in-out infinite}
  @keyframes badge-blink{0%,100%{opacity:1}50%{opacity:.45}}
  .chip{display:inline-block;padding:2px 9px;font-size:10.5px;border-radius:999px;border:1px solid var(--line2);background:#171a20;color:var(--mut);margin:2px 5px 2px 0;white-space:nowrap}
  .chip.chip-red{border-color:rgba(239,68,68,.35);color:#fca5a5;background:rgba(239,68,68,.08)}
  /* ── one flowing stream: timeline rail, cards with semantic accents ── */
  #stream{position:relative;border-left:2px solid var(--line);padding-left:18px}
  .item{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:12px;
        padding:12px 15px;margin-bottom:14px;position:relative;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
        transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
  .item:hover{transform:translateY(-1px);border-color:var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 20px rgba(0,0,0,.35)}
  .item::before{content:'';position:absolute;left:-25px;top:18px;width:9px;height:9px;border-radius:999px;background:var(--dim);border:2px solid #0a0b0d}
  .item.k-read{border-left-color:var(--teal)}
  .item.k-read::before{background:var(--teal)}
  .item.k-research{border-left-color:var(--ind)}
  .item.k-research::before{background:var(--ind)}
  .item.breaking{border-left-color:var(--amb);animation:breaking-pulse 2.4s ease-in-out infinite}
  .item.breaking::before{background:var(--amb)}
  @keyframes breaking-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}
    50%{box-shadow:0 0 22px rgba(245,158,11,.28)}
  }
  .kind-tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .kind-tag.k-read{color:var(--teal)}
  .kind-tag.k-research{color:var(--ind)}
  .titles{margin-top:7px}
  .titles div{font-size:13px;color:#cfd4dd;padding:2px 0;line-height:1.6}
  .titles div::before{content:'· ';color:var(--dim)}
  a.cite{color:#7dd3fc;text-decoration:underline;word-break:break-all;font-size:11.5px}
  .empty{font-size:13px;color:var(--mut);padding:16px;border:1px dashed var(--line2);border-radius:10px;line-height:1.7}
  /* T3: quiet (non-breaking) reads coalesce — ONE line per coin per hour,
     visibly recessed like /activity noise */
  .read-coal{font-size:11px;color:var(--mut);padding:3px 12px;margin-bottom:6px;border-left:2px solid var(--line);line-height:1.7;opacity:.55;transition:opacity .15s ease}
  .read-coal:hover{opacity:.9}
  .read-coal b{color:var(--mut);font-weight:650}
  .read-coal .cnt{color:#fcd34d;font-weight:750}
  .read-coal .tk{opacity:.9;font-size:10px;padding:0 8px}
  /* arrival animations — reduced-motion respected */
  .ev-enter{animation:ev-in .5s cubic-bezier(.2,.7,.3,1)}
  @keyframes ev-in{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:none}}
  .flash-amber{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-a 1.8s ease-out}
  @keyframes glow-a{0%{border-color:var(--amb);box-shadow:0 0 18px rgba(245,158,11,.4);background:#241a06}100%{}}
  .coal-tick{animation:coal-tick .6s ease-out}
  @keyframes coal-tick{0%{opacity:1;color:#ffe9b0}100%{opacity:.55}}
  @media (prefers-reduced-motion: reduce){
    .ev-enter,.flash-amber,.coal-tick,.item.breaking,.b-breaking{animation:none}
    .item,.read-coal{transition:none}
  }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-[1000px] mx-auto px-6 py-6">

  <header class="flex items-center justify-between mb-5 gap-3 flex-wrap">
    <span class="brand"><span class="dot"></span>HERMES-TRADER <small>/ NEWS</small></span>
    <span class="text-[10px] mono" style="color:var(--dim)" id="news-meta"></span>
  </header>

  <nav class="flex items-center gap-1 mb-5 flex-wrap">
    <a href="/" data-nav="/" class="nav-link">DASHBOARD</a>
    <a href="/activity" data-nav="/activity" class="nav-link">ACTIVITY</a>
    <a href="/news" data-nav="/news" class="nav-link">NEWS</a>
  </nav>

  <div class="uppercase tracking-wider text-[10px] font-bold mb-4" style="color:var(--dim);letter-spacing:.16em">
    coverage reads + research with news context · one stream · newest first
  </div>
  <div id="stream"><div class="empty">loading&hellip;</div></div>

  <footer class="text-[10px] text-zinc-600 mt-6 text-center">
    one wallet · live · not financial advice
  </footer>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtAgo = ms => {
  if (!ms) return '—';
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m / 60) + 'h ago';
  return Math.floor(m / 1440) + 'd ago';
};
const fmtPx = v => { if (v == null) return '?'; return v < 1 ? Number(v).toFixed(5) : v < 100 ? Number(v).toFixed(3) : Number(v).toFixed(2); };
const sideBadge = s => s === 'long' ? '<span class="badge b-long">LONG</span>'
                     : s === 'short' ? '<span class="badge b-short">SHORT</span>' : '';
// ticker chip: the eye's anchor for every coin symbol
const tk = c => c ? `<span class="tk">${esc(c)}</span>` : '';

// ── row renderers ────────────────────────────────────────────────────────────
function readCard(it) {
  const breaking = it.breaking ? '<span class="badge b-breaking">BREAKING</span>' : '';
  const shadow = it.shadow ? '<span class="badge b-shadow">SHADOW</span>' : '';
  const stats = [];
  if (it.n_recent != null) stats.push(`${it.n_recent} recent headline${it.n_recent === 1 ? '' : 's'}`);
  if (it.surge_x != null) stats.push(`surge ×${Number(it.surge_x).toFixed(2)}`);
  if (it.entry_ref_px != null) stats.push(`ref px ${fmtPx(it.entry_ref_px)}`);
  const titles = (it.titles || []).map(t => `<div>${esc(t)}</div>`).join('');
  return `
    <div class="flex items-baseline gap-2 flex-wrap">
      <span class="kind-tag k-read">coverage</span>
      ${tk(it.coin)}
      ${sideBadge(it.side)} ${breaking} ${shadow}
      <span class="text-[11px] mono" style="color:var(--dim)">${stats.join(' · ')}</span>
      <span class="text-[10px] mono ml-auto" style="color:var(--dim)">${fmtAgo(it.ts)}</span>
    </div>
    <div class="titles">${titles || '<div>no headlines captured (relevance filter may have dropped them)</div>'}</div>`;
}

function researchCard(c) {
  const verdict = c.verdict === 'LONG' ? '<span class="badge b-long">LONG</span>'
                : c.verdict === 'SHORT' ? '<span class="badge b-short">SHORT</span>'
                : `<span class="badge b-pass">${esc(c.verdict || '?')}</span>`;
  const risk = c.news_risk && c.news_risk !== 'none'
    ? `<span class="chip chip-red">news risk: ${esc(c.news_risk)}</span>` : '';
  const prov = c.provider ? `<span class="chip">${esc(c.provider)}</span>` : '';
  const conf = c.confidence != null ? `<span class="text-[11px] mono" style="color:var(--dim)">conf ${Number(c.confidence).toFixed(2)}</span>` : '';
  const cites = (c.citations || []).map(x => {
    const url = typeof x === 'string' ? x : (x.url || x.link || '');
    const title = typeof x === 'object' && x.title ? x.title : url;
    return url ? `<div>· <a class="cite" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a></div>` : '';
  }).join('');
  return `
    <div class="flex items-baseline gap-2 flex-wrap">
      <span class="kind-tag k-research">research</span>
      ${tk(c.coin)} ${verdict} ${conf} ${prov} ${risk}
      <span class="text-[10px] mono ml-auto" style="color:var(--dim)">${fmtAgo(c.ts)}</span>
    </div>
    ${c.reasoning ? `<div class="text-[13px] mt-1 leading-relaxed" style="color:#cfd4dd">${esc(c.reasoning)}</div>` : ''}
    ${cites ? `<div class="mt-1">${cites}</div>` : ''}`;
}

function makeNode(row) {
  const div = document.createElement('div');
  if (row.kind === 'read') {
    div.className = 'item k-read' + (row.breaking ? ' breaking' : '');
    div.innerHTML = readCard(row);
  } else {
    div.className = 'item k-research';
    div.innerHTML = researchCard(row);
  }
  return div;
}

// ── merged flowing stream: breaking + research = cards; quiet reads coalesce
// into ONE line per coin per hour, merged in place on incremental polls. ─────
const stream = document.getElementById('stream');
const seen = new Set();
const seenOrder = [];
const coalIndex = new Map();   // "coin|hour" -> element
let total = 0, breakingCount = 0, loaded = false;

const keyOf = r => `${r.kind}|${r.ts}|${r.coin}|${(r.titles || []).length}|${String(r.verdict || '').slice(0, 8)}`;

function remember(r) {
  const k = keyOf(r);
  if (seen.has(k)) return false;
  seen.add(k); seenOrder.push(k);
  while (seenOrder.length > 800) seen.delete(seenOrder.shift());
  return true;
}

function mergeRows(data) {
  const rows = [];
  for (const it of (data.items || [])) rows.push({ kind: 'read', ...it });
  for (const c of (data.research_context || [])) rows.push({ kind: 'research', ...c });
  rows.sort((a, b) => (a.ts || 0) - (b.ts || 0));   // chronological in, newest ends on top
  return rows;
}

const fmtHM = ms => { const d = new Date(ms || Date.now()); return d.toTimeString().slice(0, 5); };

function coalLabel(st) {
  const surge = st.surge_x != null ? ` · surge ×${Number(st.surge_x).toFixed(2)}` : '';
  const heads = st.headlines ? ` · ${st.headlines} headline${st.headlines === 1 ? '' : 's'}` : '';
  return `${tk(st.coin)} ${esc(st.side || '')} · <span class="cnt mono">×${st.n}</span> quiet read${st.n === 1 ? '' : 's'}<span class="mono">${surge}${heads} · ${fmtHM(st.t0)}→${fmtHM(st.t1)}</span>`;
}
function ingestRow(r, animate) {
  if (!remember(r)) return;
  const isQuietRead = r.kind === 'read' && !r.breaking;
  if (isQuietRead) {
    const gkey = `${r.coin}|${Math.floor((r.ts || 0) / 3600000)}`;
    const existing = coalIndex.get(gkey);
    if (existing) {
      const st = JSON.parse(existing.dataset.st);
      st.n += 1;
      st.t1 = Math.max(st.t1, r.ts || 0);
      st.t0 = Math.min(st.t0, r.ts || st.t0);
      if (r.surge_x != null) st.surge_x = r.surge_x;
      st.headlines += (r.titles || []).length;
      existing.dataset.st = JSON.stringify(st);
      existing.innerHTML = coalLabel(st);
      if (stream.firstElementChild !== existing) stream.prepend(existing);
      if (animate) { existing.classList.remove('coal-tick'); void existing.offsetWidth; existing.classList.add('coal-tick'); }
    } else {
      const el = document.createElement('div');
      el.className = 'read-coal';
      el.dataset.gkey = gkey;
      const st = { n: 1, t0: r.ts, t1: r.ts, coin: r.coin, side: r.side,
                   surge_x: r.surge_x, headlines: (r.titles || []).length };
      el.dataset.st = JSON.stringify(st);
      el.innerHTML = coalLabel(st);
      el.title = (r.titles || []).join(' · ') || 'no headlines captured';
      coalIndex.set(gkey, el);
      if (animate) el.classList.add('ev-enter');
      stream.prepend(el);
    }
  } else {
    const node = makeNode(r);
    if (animate) node.classList.add(r.breaking ? 'flash-amber' : 'ev-enter');
    stream.prepend(node);
    if (r.breaking) breakingCount++;
  }
  total++;
  while (stream.children.length > 150) {
    const last = stream.lastElementChild;
    if (last.dataset && last.dataset.gkey) coalIndex.delete(last.dataset.gkey);
    last.remove();
  }
}

const EMPTY_HTML = `<div class="empty">
  quiet stream — no coverage reads or news-flavored research yet.<br>
  the relevance filter drops homonym headlines (a beagle touching GRASS is not a
  GRASS catalyst), so sparse days are normal, not broken.</div>`;

function setMeta() {
  document.getElementById('news-meta').textContent =
    `${total} in stream · ${breakingCount} breaking`;
}

async function load() {
  try {
    const data = await (await fetch('/api/dashboard/news?limit=50')).json();
    const rows = mergeRows(data);
    if (!loaded) {
      stream.innerHTML = '';
      for (const r of rows) ingestRow(r, false);
      if (!stream.children.length) stream.innerHTML = EMPTY_HTML;
      loaded = true;
    } else {
      const hadEmpty = stream.querySelector('.empty');
      const before = total;
      for (const r of rows) ingestRow(r, true);
      if (hadEmpty && total > before) hadEmpty.remove();
    }
    setMeta();
  } catch (e) {
    if (!loaded) stream.innerHTML = '<div class="empty">news load failed — is the server up?</div>';
  }
}

(function () {
  const here = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('a[data-nav]').forEach(a => {
    if (a.dataset.nav === here) a.classList.add('nav-active');
  });
})();

load();
setInterval(load, 30000);
</script>
</body>
</html>
