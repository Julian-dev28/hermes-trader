<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hermes-trader · news</title>
<link rel="stylesheet" href="/static/app.css" />
<style>
  /* ── same design system as the /activity flight deck: sans for words,
     mono/pixel identity in wordmark + section labels; indigo→violet brand;
     amber = warnings/BREAKING; green/red = money + direction only. ── */
  :root{
    --card:#14161b; --card2:#181b21;
    --line:#23262e; --line2:#2c313c;
    --txt:#e8eaf0; --mut:#9aa1ad; --dim:#5c6370; --faint:#3d434e;
    --up:#22c55e; --dn:#ef4444; --ind:#818cf8; --amb:#f59e0b; --teal:#2dd4bf;
    --vio:#8b5cf6;
    --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a855f7 100%);
  }
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);
    background:#0a0b0d;
    background-image:radial-gradient(1100px 520px at 50% -160px,#16141f 0%,#0e1014 50%,#0a0b0d 100%);
    background-repeat:no-repeat;background-attachment:fixed;
  }
  .mono,.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .brand{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;font-size:15px;letter-spacing:.16em;color:var(--txt)}
  .brand .dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--grad);margin-right:10px;box-shadow:0 0 12px rgba(139,92,246,.65)}
  .brand small{color:var(--dim);font-weight:600;letter-spacing:.18em;font-size:10px}
  .nav-link{display:inline-block;padding:6px 14px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mut);border-radius:3px;text-decoration:none;border:1px solid transparent}
  .nav-link:hover{color:var(--txt);background:var(--card)}
  .nav-link:active{transform:translateY(1px)}
  .nav-link.nav-active{color:var(--txt);background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(168,85,247,.16));border-color:rgba(139,92,246,.45)}
  header{position:relative}
  header::after{content:'';position:absolute;inset:-14px -20px;pointer-events:none;z-index:-1;
        background:repeating-linear-gradient(0deg,rgba(139,92,246,.05) 0 1px,transparent 1px 4px)}
  .tk{display:inline-block;padding:1px 9px;border-radius:3px;background:#1d212b;border:1px solid var(--line2);color:#f4f6fa;font-weight:700;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;white-space:nowrap}
  .badge{display:inline-block;padding:1px 8px;font-size:10px;font-weight:700;letter-spacing:.08em;border-radius:3px;border:1px solid transparent;white-space:nowrap}
  .b-long{color:#86efac;background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.35)}
  .b-short{color:#fca5a5;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35)}
  .b-shadow{color:#fcd34d;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3)}
  .b-pass{color:var(--mut);background:#1d212b;border-color:var(--line2)}
  .b-breaking{color:#fcd34d;background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.45);animation:badge-blink 1.4s ease-in-out infinite}
  @keyframes badge-blink{0%,100%{opacity:1}50%{opacity:.45}}
  .chip{display:inline-block;padding:2px 9px;font-size:10.5px;border-radius:3px;border:1px solid var(--line2);background:#171a20;color:var(--mut);margin:2px 5px 2px 0;white-space:nowrap}
  .chip.chip-red{border-color:rgba(239,68,68,.35);color:#fca5a5;background:rgba(239,68,68,.08)}
  /* headline age chips — staleness must be visible instantly */
  .age{display:inline-block;margin-left:7px;padding:0 6px;font-size:9.5px;font-weight:700;border-radius:3px;border:1px solid var(--line2);background:#171a20;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;vertical-align:1px}
  .age.age-old{border-color:rgba(245,158,11,.35);color:#fcd34d;background:rgba(245,158,11,.08)}
  .age.age-stale{border-color:rgba(239,68,68,.4);color:#fca5a5;background:rgba(239,68,68,.1)}
  /* ── header strip: session-style KPI chips ── */
  .strip{position:sticky;top:10px;z-index:20;display:flex;gap:2px;flex-wrap:wrap;align-items:stretch;
         background:rgba(14,16,20,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
         border:1px solid var(--line);border-radius:4px;padding:10px 8px;margin-bottom:18px;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.03),4px 4px 0 rgba(0,0,0,.45),0 0 70px -25px rgba(139,92,246,.4)}
  .kpi{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 14px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi .v{font-size:18px;font-weight:750;line-height:1.15;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt)}
  .kpi .l{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .kpi .v.brk{color:#fcd34d}
  /* ── the deck: CATALYSTS + WATCHER panes ── */
  .deck{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:1024px){.deck{grid-template-columns:1fr 1fr}}
  .pane{background:var(--card);border:1px solid var(--line);border-radius:3px;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.03),4px 4px 0 rgba(0,0,0,.45);
        display:flex;flex-direction:column;min-height:180px}
  .pane-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .pane-head .sec-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .pane-head .pm{width:7px;height:7px;border-radius:1px}
  .pane-head .pm.pm-catalysts{background:var(--amb)}
  .pane-head .pm.pm-watcher{background:var(--teal)}
  .pane-head .pmeta{margin-left:auto;font-size:10px;color:var(--dim)}
  .pane-flow{flex:1;overflow-y:auto;max-height:480px;padding:12px 14px}
  .pane-flow::-webkit-scrollbar{width:8px}
  .pane-flow::-webkit-scrollbar-track{background:#101216}
  .pane-flow::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
  .pane-empty{font-size:12px;color:var(--dim);padding:10px 2px;line-height:1.7}
  /* catalyst cards */
  .item{background:var(--card2);border:1px solid var(--line);border-left-width:4px;border-radius:3px;
        padding:10px 13px;margin-bottom:10px;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
        transition:transform .15s ease,border-color .15s ease}
  .item:hover{transform:translate(-1px,-1px);border-color:var(--line2)}
  .item.k-read{border-left-color:var(--amb)}
  .item.k-research{border-left-color:var(--ind)}
  .item.breaking{animation:breaking-pulse 2.4s ease-in-out infinite}
  @keyframes breaking-pulse{
    0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.02),0 0 22px rgba(245,158,11,.28)}
  }
  .kind-tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .kind-tag.k-read{color:var(--amb)}
  .kind-tag.k-research{color:var(--ind)}
  .titles{margin-top:7px}
  .titles div{font-size:12.5px;color:#cfd4dd;padding:2px 0;line-height:1.6}
  .titles div::before{content:'· ';color:var(--dim)}
  /* headline source links: apparent (dotted underline + violet arrow on
     hover) without turning the reading list into a wall of blue text */
  a.src-link{color:inherit;text-decoration:none;border-bottom:1px dotted var(--line2);
    transition:color .15s ease,border-color .15s ease}
  a.src-link::after{content:' ↗';color:var(--vio);font-size:.85em;opacity:.7}
  a.src-link:hover{color:#fff;border-bottom-color:var(--vio)}
  a.src-link:hover::after{opacity:1}
  /* citation source chips — a small pill, not a blue underlined link, but
     still unmistakably clickable (dot marker + hover lift + brand accent) */
  .cite-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  a.cite{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;
    background:#171a20;border:1px solid var(--line2);color:var(--mut);
    font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    text-decoration:none;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;
    transition:color .15s ease,border-color .15s ease,background .15s ease,transform .15s ease}
  a.cite::before{content:'';width:5px;height:5px;border-radius:1px;background:var(--vio);opacity:.65;flex-shrink:0}
  a.cite:hover{color:var(--txt);border-color:var(--vio);background:#1d1930;transform:translateY(-1px)}
  a.cite:hover::before{opacity:1;box-shadow:0 0 6px rgba(139,92,246,.7)}
  /* watcher rows: fresh individual, aged coalesced */
  .ev-fresh{font-size:11.5px;color:var(--mut);padding:2px 2px;margin-bottom:5px;line-height:1.65;opacity:.62;word-break:break-word;max-height:64px;overflow:hidden;
            transition:max-height .4s ease,opacity .35s ease,margin .4s ease,padding .4s ease}
  .ev-fresh:hover{opacity:.95}
  .ev-fold{max-height:0 !important;opacity:0 !important;margin-bottom:0 !important;padding-top:0 !important;padding-bottom:0 !important}
  .read-coal{font-size:11px;color:var(--mut);padding:2px 2px;margin-bottom:5px;line-height:1.65;opacity:.55;transition:opacity .15s ease}
  .read-coal:hover{opacity:.9}
  .read-coal .cnt{color:#fcd34d;font-weight:750}
  .read-coal .tk,.ev-fresh .tk{opacity:.9;font-size:10px;padding:0 8px}
  .ev-ts{color:var(--dim);font-size:10px;white-space:nowrap}
  .pane-empty,.empty{font-size:12px;color:var(--dim);padding:12px 2px;line-height:1.7}
  /* arrival animations — reduced-motion respected */
  .ev-enter{animation:ev-in .5s cubic-bezier(.2,.7,.3,1)}
  @keyframes ev-in{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:none}}
  .ev-fresh.ev-enter{animation:fresh-in .5s cubic-bezier(.2,.7,.3,1)}
  @keyframes fresh-in{0%{opacity:0;transform:translateY(-8px)}100%{opacity:.62;transform:none}}
  .flash-amber{animation:ev-in .5s cubic-bezier(.2,.7,.3,1),glow-a 1.8s ease-out}
  @keyframes glow-a{0%{border-color:var(--amb);box-shadow:0 0 18px rgba(245,158,11,.4);background:#241a06}100%{}}
  .coal-tick{animation:coal-tick .6s ease-out}
  @keyframes coal-tick{0%{opacity:1;color:#ffe9b0}100%{opacity:.55}}
  /* ── the pixel cat (same mascot as the dashboard, every tab) ── */
  .cat{width:28px;height:28px;display:inline-block;margin-right:9px}
  .cat svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
  .cat .c-ears-p,.cat .c-ears-f,.cat .c-eyes-w,.cat .c-eyes-c,.cat .c-zzz{display:none}
  .cat.cat-alert .c-ears-n,.cat.cat-alert .c-eyes-n{display:none}
  .cat.cat-alert .c-ears-p,.cat.cat-alert .c-eyes-w{display:block}
  .cat.cat-sad .c-ears-n{display:none}
  .cat.cat-sad .c-ears-f{display:block}
  .cat.cat-sleep .c-eyes-n,.cat.cat-sleep .c-eyes-w{display:none}
  .cat.cat-sleep .c-eyes-c,.cat.cat-sleep .c-zzz{display:block}
  .cat .c-tail-a{animation:tail-a 1.4s steps(1) infinite}
  .cat .c-tail-b{animation:tail-b 1.4s steps(1) infinite}
  @keyframes tail-a{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes tail-b{0%,49%{opacity:0}50%,100%{opacity:1}}
  .cat.cat-sleep .c-tail-a{animation:none;opacity:1}
  .cat.cat-sleep .c-tail-b{animation:none;opacity:0}
  .cat.cat-sleep svg{animation:cat-breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes cat-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.93)}}
  .cat .c-zzz rect{animation:zzz 2.4s steps(1) infinite}
  .cat .c-zzz rect:nth-child(2){animation-delay:.8s}
  .cat .c-zzz rect:nth-child(3){animation-delay:1.6s}
  @keyframes zzz{0%,60%{opacity:1}61%,100%{opacity:.15}}
  .cat.cat-bounce{animation:cat-bounce .7s cubic-bezier(.3,1.8,.4,1)}
  @keyframes cat-bounce{0%{transform:translateY(0)}35%{transform:translateY(-6px)}70%{transform:translateY(1px)}100%{transform:none}}
  /* ── skeleton shimmer: modern loading state, replaces "loading…" text ── */
  .skeleton{position:relative;overflow:hidden;background:#171a20;border-radius:3px;color:transparent !important;display:inline-block;min-width:64px}
  .skeleton::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(245,158,11,.12),transparent);
    animation:shimmer 1.6s ease-in-out infinite}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .kpi .v.tick-up{animation:kpi-tick-g .9s ease-out}
  .kpi .v.tick-dn{animation:kpi-tick-r .9s ease-out}
  @keyframes kpi-tick-g{0%{color:#86efac}100%{}}
  @keyframes kpi-tick-r{0%{color:#fca5a5}100%{}}
  @media (prefers-reduced-motion: reduce){
    .ev-enter,.flash-amber,.coal-tick,.item.breaking,.b-breaking,.ev-fresh.ev-enter{animation:none}
    .item,.read-coal,.ev-fresh{transition:none}
    .cat .c-tail-a,.cat .c-tail-b,.cat.cat-sleep svg,.cat .c-zzz rect,.cat.cat-bounce{animation:none}
    .skeleton::after,.kpi .v.tick-up,.kpi .v.tick-dn{animation:none}
  }
  /* ── v3 ambient layer (2026-07-17): shader canvas + status-reactive
     accents, matching the landing page. On this tab the CAT is the status
     source — body:has() watches its sleep state and shifts the OKLCH accent
     pair amber when the feed goes stale/offline. Scroll progress hairline is
     a pure-CSS scroll-driven animation; browsers without it never grow the
     bar. ── */
  :root{ --accA:oklch(0.585 0.233 277.1); --accB:oklch(0.627 0.265 303.9) }
  body:has(#pixel-cat.cat-sleep){ --accA:oklch(0.769 0.188 70.1); --accB:oklch(0.666 0.179 58.3) }
  #gl-bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none}
  #scroll-progress{position:fixed;top:0;left:0;height:2px;width:100%;z-index:50;
    transform-origin:0 50%;transform:scaleX(0);
    background:linear-gradient(90deg,var(--accA),var(--accB))}
  @supports (animation-timeline: scroll()){
    @media (prefers-reduced-motion: no-preference){
      #scroll-progress{animation:growX linear both;animation-timeline:scroll(root)}
    }
  }
  @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .nav-link.nav-active{
    background:linear-gradient(135deg,color-mix(in oklab,var(--accA) 16%,transparent),color-mix(in oklab,var(--accB) 16%,transparent));
    border-color:color-mix(in oklab,var(--vio) 45%,transparent)}
  ::selection{background:color-mix(in oklab,var(--vio) 32%,transparent)}
  html{scrollbar-color:#2c313c #0a0b0d;scrollbar-width:thin}
  .mono,.num{font-variant-numeric:tabular-nums}
  /* ── v4 app-shell (2026-07-17): cross-document view transitions — every
     tab opts in, so navigation cross-fades and the CAT MORPHS between pages
     (it carries view-transition-name:cat on all four). Speculation-rules
     prerender (in the body) makes the hop feel instant. text-box trims
     cap-height dead space so labels and numerals sit optically flush. ── */
  @view-transition{navigation:auto}
  #pixel-cat{view-transition-name:cat}
  ::view-transition-group(cat){animation-duration:.28s}
  @supports (text-box: trim-both cap alphabetic){
    .sec-label,.kv{text-box:trim-both cap alphabetic}
  }
</style>

</head>
<body class="min-h-screen">
<canvas id="gl-bg" aria-hidden="true"></canvas>
<div id="scroll-progress" aria-hidden="true"></div>
<script type="speculationrules">
{"prerender":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/api/*"}}]},"eagerness":"moderate"}]}
</script>
<script>
// g-then-key tab hops (g d / g a / g n / g p / g t / g y) — app-style keyboard nav,
// inert while typing in a field or holding a modifier
(function () {
  const map = { d: '/', a: '/activity', n: '/news', y: '/analytics', t: '/trends' };
  let armed = 0;
  addEventListener('keydown', e => {
    if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'g') { armed = Date.now(); return; }
    if (armed && Date.now() - armed < 900 && map[e.key]) location.href = map[e.key];
    armed = 0;
  });
})();
</script>
<script>
// ── v3 ambient layer (2026-07-17), same engine as the landing page: a
// hand-written WebGL2 fbm aurora in the brand ramp, uniforms fed by the
// summary payload this page already polls for the cat (refreshCat calls
// window.__setGlState). Self-contained IIFE — no names leak. Budget: low-power
// GPU hint, DPR cap 1.5, ~30fps, hidden-tab pause; prefers-reduced-motion
// renders exactly one static frame; no WebGL2 removes the canvas and the CSS
// gradient below stays. ──
(function () {
  const cv = document.getElementById('gl-bg');
  const rm = matchMedia('(prefers-reduced-motion: reduce)');
  const gl = cv.getContext('webgl2', { antialias: false, depth: false, stencil: false, powerPreference: 'low-power' });
  if (!gl) { cv.remove(); return; }
  const VS = `#version 300 es
void main(){vec2 v=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(v*2.-1.,0.,1.);}`;
  const FS = `#version 300 es
precision highp float;
uniform vec2 u_res;uniform float u_t;
uniform float u_mood;uniform float u_energy;uniform float u_pos;
out vec4 o;
float hash(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+19.19);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+17.3;a*=.5;}return s;}
const float B[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
void main(){
 vec2 uv=gl_FragCoord.xy/u_res;
 vec2 p=vec2(uv.x*u_res.x/u_res.y,uv.y);
 float t=u_t*(.015+.05*u_energy);
 vec2 q=vec2(fbm(p*1.3+vec2(0.,t)),fbm(p*1.3+vec2(5.2,-t*.7)));
 float v=fbm(p*2.1+2.2*q+vec2(0.,t*.4));
 float sky=smoothstep(.15,.85,uv.y);
 float glow=sky*(.10+.22*v)*(.45+.55*u_energy)*(1.+.35*u_pos);
 vec3 aur=mix(vec3(.388,.400,.945),vec3(.659,.333,.969),v);
 aur=mix(aur,u_mood>=0.?vec3(.13,.72,.36):vec3(.92,.26,.26),abs(u_mood)*.38);
 vec3 col=vec3(.039,.043,.051)+aur*glow;
 col+=aur*exp(-abs(uv.y-.72)*6.)*.06*(.5+.5*u_energy);
 col*=1.-.28*length(uv-vec2(.5,.55));
 int bi=int(mod(gl_FragCoord.y,4.))*4+int(mod(gl_FragCoord.x,4.));
 col+=(B[bi]/16.-.5)/255.*3.;
 o=vec4(col,1.);}`;
  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
  } catch (e) { cv.remove(); return; }
  gl.useProgram(prog);
  const U = n => gl.getUniformLocation(prog, n);
  const uRes = U('u_res'), uT = U('u_t'), uMood = U('u_mood'), uEnergy = U('u_energy'), uPos = U('u_pos');
  const tgt = { mood: 0, energy: 0.45, pos: 0 };
  const cur = { mood: 0, energy: 0.45, pos: 0 };
  window.__setGlState = s => {
    tgt.mood = Math.max(-1, Math.min(1, (s.daily_pnl_pct ?? 0) / 2));
    tgt.energy = s.status === 'scanning' ? 1 : s.status === 'stale' ? 0.45 : 0.12;
    tgt.pos = Math.min(1, (s.open_positions ?? 0) / 5);
    if (rm.matches) draw(t0 + 1);
  };
  function resize() {
    const dpr = Math.min(1.5, window.devicePixelRatio || 1);
    cv.width = Math.round(innerWidth * dpr);
    cv.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, cv.width, cv.height);
    if (rm.matches) draw(t0 + 1);
  }
  const t0 = performance.now();
  let last = 0, rafId = 0;
  function draw(now) {
    const k = rm.matches ? 1 : 0.04;
    cur.mood += (tgt.mood - cur.mood) * k;
    cur.energy += (tgt.energy - cur.energy) * k;
    cur.pos += (tgt.pos - cur.pos) * k;
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uT, (now - t0) / 1000);
    gl.uniform1f(uMood, cur.mood);
    gl.uniform1f(uEnergy, cur.energy);
    gl.uniform1f(uPos, cur.pos);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function loop(now) {
    rafId = requestAnimationFrame(loop);
    if (now - last < 33) return;
    last = now;
    draw(now);
  }
  function setMode() {
    cancelAnimationFrame(rafId);
    if (rm.matches) draw(t0 + 1);
    else rafId = requestAnimationFrame(loop);
  }
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(rafId);
    if (!document.hidden && !rm.matches) rafId = requestAnimationFrame(loop);
  });
  rm.addEventListener('change', setMode);
  resize(); setMode();
})();
</script>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtHM = ms => { const d = new Date(ms || Date.now()); return d.toTimeString().slice(0, 5); };
const fmtAgo = ms => {
  if (!ms) return '—';
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m / 60) + 'h ago';
  return Math.floor(m / 1440) + 'd ago';
};
// article age in hours → "3h old" / "2d old"; amber past 2 days, red past the
// backend's 7-day staleness floor (old ledger rows can predate the guard)
function ageChip(h) {
  if (h == null || !isFinite(h)) return '';
  const label = h < 1 ? Math.max(1, Math.round(h * 60)) + 'm old'
              : h < 48 ? Math.round(h) + 'h old'
              : Math.round(h / 24) + 'd old';
  const cls = h > 168 ? ' age-stale' : h > 48 ? ' age-old' : '';
  return `<span class="age${cls}">${label}</span>`;
}
const fmtPx = v => { if (v == null) return '?'; return v < 1 ? Number(v).toFixed(5) : v < 100 ? Number(v).toFixed(3) : Number(v).toFixed(2); };
const tk = c => c ? `<span class="tk">${esc(c)}</span>` : '';
const sideBadge = s => s === 'long' ? '<span class="badge b-long">LONG</span>'
                     : s === 'short' ? '<span class="badge b-short">SHORT</span>' : '';

// ── citation chips: source pills, not blue underlined links ─────────────────
const domainOf = u => { const m = String(u || '').match(/^https?:\/\/(?:www\.)?([^/\s?#]+)/); return m ? m[1] : u; };
function citeChip(c) {
  const url = typeof c === 'string' ? ((c.match(/https?:\/\/\S+/g) || []).pop() || '') : (c.url || c.link || '');
  if (!url) return '';
  const rawTitle = typeof c === 'object' ? String(c.title || '')
                  : String(c || '').replace(/\s+—\s+https?:\/\/\S+$/, '').trim();
  // server already shortens titleless citations to a distinguishing
  // host+path (_parse_citation/_short_url) — keep that link text as-is.
  // Only collapse to a bare domain when there is truly nothing to show.
  const label = (rawTitle && rawTitle !== url) ? rawTitle : domainOf(url);
  return `<a class="cite" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="${esc(rawTitle || url)}">${esc(label)}</a>`;
}

// ── CATALYSTS pane: breaking reads + news-context research, full cards ──────
function titlesBlock(it) {
  const ages = it.title_ages_h;
  const urls = it.title_urls;
  const lines = (it.titles || []).map((t, i) => {
    const u = urls && urls[i];
    const body = u
      ? `<a class="src-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`
      : esc(t);
    const age = ages && ages[i] != null ? ` ${ageChip(ages[i])}` : '';
    return `<div>${body}${age}</div>`;
  }).join('');
  return lines ? `<div class="titles">${lines}</div>` : '';
}
function readCard(it) {
  const stats = [];
  if (it.n_recent != null) stats.push(`${it.n_recent} recent headline${it.n_recent === 1 ? '' : 's'}`);
  if (it.surge_x != null) stats.push(`surge ×${Number(it.surge_x).toFixed(2)}`);
  if (it.entry_ref_px != null) stats.push(`ref px ${fmtPx(it.entry_ref_px)}`);
  return `
    <div class="flex items-baseline gap-2 flex-wrap">
      <span class="kind-tag k-read">coverage</span>
      ${tk(it.coin)} ${sideBadge(it.side)}
      <span class="badge b-breaking">BREAKING</span>
      ${it.shadow ? '<span class="badge b-shadow">SHADOW</span>' : ''}
      <span class="text-[11px] mono" style="color:var(--dim)">${stats.join(' · ')}</span>
      <span class="ev-ts mono" style="margin-left:auto">read ${fmtAgo(it.ts)}</span>
    </div>
    ${titlesBlock(it) || '<div class="titles"><div>no headlines captured (relevance filter may have dropped them)</div></div>'}`;
}
function researchCard(c) {
  const verdict = c.verdict === 'LONG' ? '<span class="badge b-long">LONG</span>'
                : c.verdict === 'SHORT' ? '<span class="badge b-short">SHORT</span>'
                : `<span class="badge b-pass">${esc(c.verdict || '?')}</span>`;
  const risk = c.news_risk && c.news_risk !== 'none'
    ? `<span class="chip chip-red">news risk: ${esc(c.news_risk)}</span>` : '';
  const conf = c.confidence != null ? `<span class="text-[11px] mono" style="color:var(--dim)">conf ${Number(c.confidence).toFixed(2)}</span>` : '';
  const cites = (c.citations || []).map(citeChip).filter(Boolean).join('');
  return `
    <div class="flex items-baseline gap-2 flex-wrap">
      <span class="kind-tag k-research">research</span>
      ${tk(c.coin)} ${verdict} ${conf} ${risk}
      <span class="ev-ts mono" style="margin-left:auto">${fmtAgo(c.ts)}</span>
    </div>
    ${c.reasoning ? `<div class="text-[12.5px] mt-1 leading-relaxed" style="color:#cfd4dd">${esc(c.reasoning)}</div>` : ''}
    ${cites ? `<div class="cite-row">${cites}</div>` : ''}`;
}
function catalystNode(row) {
  const div = document.createElement('div');
  if (row.kind === 'read') {
    div.className = 'item k-read breaking';
    div.innerHTML = readCard(row);
  } else {
    div.className = 'item k-research';
    div.innerHTML = researchCard(row);
  }
  return div;
}

// ── WATCHER pane: quiet coverage checks with time-decay flow ────────────────
let FRESH_MS = 15 * 60 * 1000;
const coalIndex = new Map();   // "coin|hour" -> element

function watcherFreshNode(r) {
  const div = document.createElement('div');
  div.className = 'ev-fresh';
  div.dataset.ev = JSON.stringify(r);
  const nTitles = (r.titles || []).length;
  const newestAge = (r.title_ages_h && r.title_ages_h.length) ? ageChip(Math.min(...r.title_ages_h)) : '';
  const what = nTitles
    ? `coverage checked — ${nTitles} headline${nTitles === 1 ? '' : 's'}, no surge${newestAge}`
    : 'coverage checked, nothing new';
  div.innerHTML = `<span class="ev-ts mono">${fmtHM(r.ts)}</span> ${tk(r.coin)} — ${what}`;
  if (nTitles) div.title = (r.titles || []).join(' · ');
  return div;
}
function coalLabel(st) {
  if (st.n === 1)
    return `<span class="ev-ts mono">${fmtHM(st.t0)}</span> ${tk(st.coin)} — coverage checked, nothing new`;
  return `${tk(st.coin)} — coverage checked <span class="cnt mono">×${st.n}</span> this hour, nothing new`;
}
function coalMergeOrCreate(r, flow, animate, floatTop) {
  const gkey = `${r.coin}|${Math.floor((r.ts || 0) / 3600000)}`;
  const existing = coalIndex.get(gkey);
  if (existing) {
    const st = JSON.parse(existing.dataset.st);
    st.n += 1;
    st.t1 = Math.max(st.t1, r.ts || 0);
    st.t0 = Math.min(st.t0, r.ts || st.t0);
    existing.dataset.st = JSON.stringify(st);
    existing.innerHTML = coalLabel(st);
    if (floatTop && existing.parentElement && existing.parentElement.firstElementChild !== existing)
      existing.parentElement.prepend(existing);
    if (animate) { existing.classList.remove('coal-tick'); void existing.offsetWidth; existing.classList.add('coal-tick'); }
    return null;
  }
  const el = document.createElement('div');
  el.className = 'read-coal';
  el.dataset.gkey = gkey;
  const st = { n: 1, t0: r.ts, t1: r.ts, coin: r.coin };
  el.dataset.st = JSON.stringify(st);
  el.innerHTML = coalLabel(st);
  if ((r.titles || []).length) el.title = r.titles.join(' · ');
  coalIndex.set(gkey, el);
  return el;
}

// ── stream state ─────────────────────────────────────────────────────────────
const FLOWS = {};
const seen = new Set();
const seenOrder = [];
let catalystCount = 0;

const keyOf = r => `${r.kind}|${r.ts}|${r.coin}|${(r.titles || []).length}|${String(r.verdict || '').slice(0, 8)}`;
function remember(r) {
  const k = keyOf(r);
  if (seen.has(k)) return false;
  seen.add(k); seenOrder.push(k);
  while (seenOrder.length > 800) seen.delete(seenOrder.shift());
  return true;
}
function clearEmpty(flow) {
  const p = flow.querySelector('.pane-empty');
  if (p) p.remove();
}
function insertTop(flow, node, animate, cls) {
  clearEmpty(flow);
  if (animate) node.classList.add(cls || 'ev-enter');
  flow.prepend(node);
  while (flow.children.length > 120) {
    const last = flow.lastElementChild;
    if (last.dataset && last.dataset.gkey) coalIndex.delete(last.dataset.gkey);
    last.remove();
  }
}

// one row, chronological order in → one mutation at the top of its pane
function ingestRow(r, animate) {
  if (!remember(r)) return;
  if (r.kind === 'research' || (r.kind === 'read' && r.breaking)) {
    catalystCount++;
    insertTop(FLOWS.catalysts, catalystNode(r), animate,
              r.breaking ? 'flash-amber' : 'ev-enter');
    return;
  }
  // quiet read → watcher, time-decay
  const isFresh = r.fresh && (r.ts || 0) >= Date.now() - FRESH_MS;
  if (isFresh) {
    insertTop(FLOWS.watcher, watcherFreshNode(r), animate);
    return;
  }
  const node = coalMergeOrCreate(r, FLOWS.watcher, animate, true);
  if (node) insertTop(FLOWS.watcher, node, animate);
}

// time-decay fold: fresh watcher rows age into their coin/hour groups
const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function foldAged() {
  const cutoff = Date.now() - FRESH_MS;
  const nodes = FLOWS.watcher.querySelectorAll('.ev-fresh:not(.ev-fold)');
  for (let i = nodes.length - 1; i >= 0; i--) {   // oldest first
    const el = nodes[i];
    let r;
    try { r = JSON.parse(el.dataset.ev); } catch { el.remove(); continue; }
    if ((r.ts || 0) >= cutoff) continue;
    const g = coalMergeOrCreate(r, FLOWS.watcher, true, false);
    if (g) { el.replaceWith(g); }
    else if (REDUCED_MOTION) { el.remove(); }
    else { el.classList.add('ev-fold'); setTimeout(() => el.remove(), 450); }
  }
}

// ── header strip + empties ───────────────────────────────────────────────────
function kpiChip(key, label, value, cls) {
  return `<div class="kpi"><span class="v${cls ? ' ' + cls : ''}" data-k="${key}">${value}</span><span class="l">${label}</span></div>`;
}
const stripLast = {};
function flashChanged(el) {
  el.querySelectorAll('.v[data-k]').forEach(v => {
    const k = v.dataset.k, cur = Number(v.textContent.replace(/[^0-9.-]/g, ''));
    if (!isNaN(cur) && stripLast[k] != null && cur !== stripLast[k]) {
      v.classList.remove('tick-up', 'tick-dn');
      void v.offsetWidth;
      v.classList.add(cur > stripLast[k] ? 'tick-up' : 'tick-dn');
    }
    if (!isNaN(cur)) stripLast[k] = cur;
  });
}
function renderStrip(stats) {
  if (!stats) return;
  const el = document.getElementById('news-strip');
  el.innerHTML =
    kpiChip('reads', 'reads today', stats.reads_today ?? 0) +
    kpiChip('breaking', 'breaking', stats.breaking_today ?? 0, (stats.breaking_today ?? 0) > 0 ? 'brk' : '') +
    kpiChip('last', 'last read', stats.last_read_ts ? fmtAgo(stats.last_read_ts) : '—');
  flashChanged(el);
}
function paneEmpties() {
  if (!FLOWS.catalysts.children.length) {
    const d = document.createElement('div');
    d.className = 'pane-empty';
    d.textContent = 'no catalysts yet — a coverage surge or a news-flavored verdict lands here';
    FLOWS.catalysts.appendChild(d);
  }
  if (!FLOWS.watcher.children.length) {
    const d = document.createElement('div');
    d.className = 'pane-empty';
    d.textContent = 'quiet stream — no coverage reads yet. sparse days are normal, not broken.';
    FLOWS.watcher.appendChild(d);
  }
}

// ── load + poll ──────────────────────────────────────────────────────────────
let loaded = false;
function mergeRows(data) {
  const rows = [];
  for (const it of (data.items || [])) rows.push({ kind: 'read', ...it });
  for (const c of (data.research_context || [])) rows.push({ kind: 'research', ...c });
  rows.sort((a, b) => (a.ts || 0) - (b.ts || 0));   // chronological in, newest ends on top
  return rows;
}
async function load() {
  try {
    const data = await (await fetch('/api/dashboard/news?limit=80')).json();
    if (data.fresh_window_s) FRESH_MS = data.fresh_window_s * 1000;
    renderStrip(data.stats);
    const rows = mergeRows(data);
    if (!loaded) {
      FLOWS.catalysts.innerHTML = '';
      FLOWS.watcher.innerHTML = '';
      for (const r of rows) ingestRow(r, false);
      paneEmpties();
      loaded = true;
    } else {
      for (const r of rows) ingestRow(r, true);
      foldAged();
    }
    document.getElementById('meta-catalysts').textContent = catalystCount ? `${catalystCount} in window` : '';
    document.getElementById('news-meta').textContent = `flight deck · updated ${fmtHM(Date.now())}`;
  } catch (e) {
    if (!loaded) FLOWS.catalysts.innerHTML = '<div class="pane-empty">news load failed — is the server up?</div>';
  }
}

(function () {
  const here = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('a[data-nav]').forEach(a => {
    if (a.dataset.nav === here) a.classList.add('nav-active');
  });
})();

FLOWS.catalysts = document.getElementById('flow-catalysts');
FLOWS.watcher = document.getElementById('flow-watcher');
load();
setInterval(load, 30000);
setInterval(foldAged, 20000);

// ── the cat reacts to the tape (same mascot + logic as the dashboard) ──────
let catLastEquity = null;
function updateCat(s) {
  const cat = document.getElementById('pixel-cat');
  if (!cat) return;
  cat.classList.remove('cat-sleep', 'cat-sad', 'cat-alert');
  if (s.status !== 'scanning') cat.classList.add('cat-sleep');
  else if ((s.daily_pnl ?? 0) < 0) cat.classList.add('cat-sad');
  else if ((s.open_positions ?? 0) > 0) cat.classList.add('cat-alert');
  if (catLastEquity != null && (s.equity ?? 0) > catLastEquity + 0.004) {
    cat.classList.remove('cat-bounce');
    void cat.offsetWidth;
    cat.classList.add('cat-bounce');
  }
  catLastEquity = s.equity ?? catLastEquity;
}
async function refreshCat() {
  try {
    const s = await (await fetch('/api/dashboard/summary')).json();
    updateCat(s);
    if (window.__setGlState) window.__setGlState(s);   // shader shares the cat's payload
  } catch (e) {}
}
refreshCat();
setInterval(refreshCat, 20000);
</script>
