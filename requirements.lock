# Exact reproducible dependency set for pathia (library + dev extras).
# pyproject.toml keeps loose ranges for the library; this lock pins everything
# CI and prod actually install, so a build today is the same build in a year.
# --universal + --python-version 3.11 (the floor in pyproject.toml, and what
# Dockerfile's python:3.11-slim runs) produces one file valid for the whole
# CI matrix (3.11, 3.12) via environment markers, not a per-version lock.
#
# Regenerate after any pyproject.toml dependency change:
#   uv pip compile pyproject.toml --extra dev --universal --python-version 3.11 -o requirements.lock
#
# CI installs from this file: pip install -e . --no-deps && pip install -r requirements.lock
#
