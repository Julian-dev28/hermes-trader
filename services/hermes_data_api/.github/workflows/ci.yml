name: hermes-data-api CI

on:
  push:
    paths:
      - "services/hermes_data_api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "services/hermes_data_api/**"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: hermes-data-api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint (ruff, soft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Soft-fail: lint findings surface but don't block the pipeline yet.
      - name: Ruff check
        working-directory: services/hermes_data_api
        run: ruff check . || true

  test:
    name: test (pytest, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/hermes_data_api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/hermes_data_api/requirements.txt

      - name: Run tests
        run: |
          # Tolerate "no tests collected yet" (exit 5) while the suite is being
          # built in parallel; still fail on real test failures (exit 1/2/3).
          mkdir -p services/hermes_data_api/tests
          set +e
          pytest services/hermes_data_api/tests -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice::no tests collected yet — tolerating until suite lands"
            exit 0
          fi
          exit "$code"

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/hermes_data_api
          file: services/hermes_data_api/Dockerfile
          push: false
          load: true
          tags: hermes-data-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
