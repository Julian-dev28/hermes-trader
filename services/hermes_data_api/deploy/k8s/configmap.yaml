apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-data-api-config
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-data-api
    app.kubernetes.io/part-of: hermes-data-api
# Non-secret env only. HERMES_DATABASE_URL lives in a Secret, not here.
data:
  HERMES_ENV: "prod"
  HERMES_LOG_LEVEL: "INFO"
  HERMES_LOG_JSON: "true"
  HERMES_SERVICE_NAME: "hermes-data-api"
  HERMES_RATE_LIMIT_PER_MIN: "500"
  HERMES_RATE_LIMIT_BURST: "60"
  HERMES_HL_BASE_URL: "https://api.hyperliquid.xyz"
