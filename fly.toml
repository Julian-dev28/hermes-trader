# Fly.io deploy config for pathia.
# Edit `app` to your chosen name; `flyctl launch` will offer a default.

app = "pathia"
primary_region = "iad"  # change to a region near you

[build]
  dockerfile = "Dockerfile"

# Five processes share the image — this is scripts/restart.sh's process list,
# translated to Fly process groups (restart.sh itself does NOT run in the
# container; each process is launched directly so Fly supervises it):
#   web      — FastAPI server (dashboard + JSON API + SSE feed + /metrics)
#   loop     — autonomous trading loop (scan → research → execute → DSL monitor)
#   sched    — scripts/scheduler.py: fires autonomous-cycle (daily),
#              trends-price (30min), and trends-recorders (6h)
#              — see scripts/scheduler.py:JOBS
#   rotator  — scripts/log_rotate.py --daemon: truncates logs/*.log in place
#              on an interval and refuses new starts under the disk-guard
#              threshold (see pathia/log_setup.py). Needed because
#              `sched` writes its fired jobs' output to real files
#              (scripts/scheduler.py:run_job), independent of how sched
#              itself is launched
[processes]
  web     = "env PATHIA_STATE_READONLY=1 PATHIA_HL_RATE_REFILL_PER_SEC=2 PATHIA_HL_RATE_CAPACITY=60 python3 -m pathia.server"
  loop    = "python3 scripts/trading_loop.py"
  sched   = "python3 scripts/scheduler.py"
  rotator = "python3 scripts/log_rotate.py --daemon"

# web/loop/sched all read or write state under /data (see the
# Dockerfile's "Runtime state" comment — PATHIA_STATE_DIR plus the
# scheduler's .state symlink). `rotator` only touches logs/ inside the
# container's own writable layer (deliberately NOT on the volume — log
# history isn't state that needs backup/rollback semantics, and letting it
# live outside the shared volume keeps the one singleton-sensitive volume
# smaller); it does not need the mount.
[[mounts]]
  source = "pathia_data"   # `fly volumes create pathia_data --size 1`
  destination = "/data"
  processes = ["web", "loop", "sched"]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false  # don't sleep — the loop/sched must keep running
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  # Shallow: is the web process serving. This one gates routing, so it must not
  # fail because the trading loop died — that would take the dashboard offline
  # exactly when it is needed.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/api/health"

  # Deep: is the SYSTEM working — loop heartbeat, market-feed integrity, disk
  # headroom. Returns 503 when it is not, which is what should page someone.
  # Kept separate from the routing check above on purpose.
  [[http_service.checks]]
    grace_period = "120s"
    interval = "60s"
    method = "GET"
    timeout = "10s"
    path = "/api/health/system"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["loop"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["sched"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["rotator"]

[env]
  PATHIA_PORT = "8000"
  PATHIA_SCAN_INTERVAL = "60"
